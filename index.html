<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NASA Solar System Simulator | Real-Time Astrophysics Visualization</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Exo+2:wght@300;400;500;600;700&family=Source+Code+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Realistic Space Colors */
            --space-deep: #000000;
            --space-dark: #0a0e17;
            --space-medium: #1a2238;
            --space-light: #252f4a;
            
            /* NASA Colors */
            --nasa-blue: #0B3D91;
            --nasa-red: #FC3D21;
            --nasa-white: #FFFFFF;
            
            /* Scientific Colors */
            --sci-blue: #0066FF;
            --sci-cyan: #00D4FF;
            --sci-green: #00FFAA;
            --sci-yellow: #FFD700;
            --sci-orange: #FF6B00;
            --sci-purple: #9D4EDD;
            
            /* Real Planet Colors (Actual NASA Colors) */
            --sun-real: #FFD700;
            --mercury-real: #8C7853;
            --venus-real: #FFC649;
            --earth-real: #2B65EC;
            --mars-real: #C1440E;
            --jupiter-real: #E0AA70;
            --saturn-real: #FAD5A5;
            --uranus-real: #D1E7E7;
            --neptune-real: #5B5BFF;
            
            /* UI Elements */
            --ui-glass: rgba(10, 14, 23, 0.85);
            --ui-border: rgba(100, 150, 255, 0.15);
            --ui-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            
            /* Animations */
            --transition-physics: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        /* Reset & Base */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html {
            font-size: 16px;
            overflow: hidden;
        }
        
        body {
            font-family: 'Exo 2', 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--space-deep);
            color: var(--nasa-white);
            height: 100vh;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            position: relative;
        }
        
        /* Ultra-Realistic Space Background */
        .space-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: 
                radial-gradient(ellipse at 20% 30%, rgba(27, 39, 75, 0.3) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 70%, rgba(67, 19, 109, 0.2) 0%, transparent 60%),
                linear-gradient(to bottom, #000000, #0a0e17);
        }
        
        /* Realistic Starfield with Parallax */
        .starfield-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }
        
        .stars-layer {
            position: absolute;
            width: 100%;
            height: 100%;
        }
        
        .star {
            position: absolute;
            background: #ffffff;
            border-radius: 50%;
        }
        
        /* Nebula & Dust Clouds */
        .space-dust {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 15% 25%, rgba(59, 130, 246, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 85% 75%, rgba(139, 92, 246, 0.05) 0%, transparent 50%);
            filter: blur(60px);
            animation: dust-drift 180s infinite linear;
            pointer-events: none;
            z-index: 1;
        }
        
        /* Realistic Sun Glow */
        .sun-glow {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, 
                rgba(255, 215, 0, 0.15) 0%,
                rgba(255, 140, 0, 0.1) 40%,
                rgba(255, 69, 0, 0.05) 70%,
                transparent 100%);
            border-radius: 50%;
            filter: blur(40px);
            animation: solar-wind 20s infinite alternate;
            pointer-events: none;
            z-index: 5;
        }
        
        /* Professional Header */
        .simulator-header {
            position: fixed;
            top: 0;
            width: 100%;
            height: 70px;
            background: rgba(10, 14, 23, 0.92);
            backdrop-filter: blur(15px) saturate(180%);
            -webkit-backdrop-filter: blur(15px) saturate(180%);
            border-bottom: 1px solid var(--ui-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 40px;
            z-index: 1000;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.3);
        }
        
        .nasa-header {
            display: flex;
            align-items: center;
            gap: 20px;
        }
        
        .nasa-logo {
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, var(--nasa-red), var(--nasa-blue));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            font-size: 20px;
            color: white;
            box-shadow: 0 0 30px rgba(252, 61, 33, 0.4);
            animation: nasa-pulse 3s infinite alternate;
        }
        
        .header-title {
            display: flex;
            flex-direction: column;
        }
        
        .main-title {
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            font-size: 22px;
            background: linear-gradient(135deg, var(--sci-cyan), var(--sci-blue));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: 2px;
        }
        
        .subtitle {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.6);
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-top: 2px;
        }
        
        /* Real-time Clock */
        .real-time-clock {
            font-family: 'Source Code Pro', monospace;
            font-size: 14px;
            color: var(--sci-green);
            background: rgba(0, 0, 0, 0.3);
            padding: 8px 16px;
            border-radius: 6px;
            border: 1px solid rgba(0, 212, 255, 0.2);
        }
        
        /* Main Simulation Container */
        .simulation-container {
            position: fixed;
            top: 70px;
            left: 0;
            width: 100%;
            height: calc(100vh - 150px);
            overflow: hidden;
            perspective: 2000px;
        }
        
        #solar-system {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 2500px;
            height: 2500px;
            transform-style: preserve-3d;
            transition: transform 1s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        /* Ultra-Realistic Sun */
        .real-sun {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 140px;
            height: 140px;
            background: radial-gradient(circle at 30% 30%, 
                var(--sun-real) 0%,
                #FF8C00 40%,
                #FF4500 70%);
            border-radius: 50%;
            cursor: pointer;
            z-index: 100;
            box-shadow: 
                0 0 150px rgba(255, 215, 0, 0.9),
                0 0 300px rgba(255, 140, 0, 0.7),
                0 0 450px rgba(255, 69, 0, 0.5),
                inset 0 0 60px rgba(255, 255, 255, 0.4);
            animation: solar-activity 5s infinite alternate;
            transition: var(--transition-physics);
            filter: brightness(1.2);
        }
        
        .real-sun::before {
            content: '';
            position: absolute;
            top: -20px;
            left: -20px;
            right: -20px;
            bottom: -20px;
            background: radial-gradient(circle, 
                rgba(255, 215, 0, 0.3) 0%,
                rgba(255, 140, 0, 0.2) 40%,
                rgba(255, 69, 0, 0.1) 70%,
                transparent 100%);
            border-radius: 50%;
            animation: corona-pulse 3s infinite alternate;
            z-index: -1;
        }
        
        .real-sun.selected {
            box-shadow: 
                0 0 200px rgba(255, 215, 0, 1),
                0 0 400px rgba(255, 140, 0, 0.8),
                0 0 600px rgba(255, 69, 0, 0.6),
                inset 0 0 80px rgba(255, 255, 255, 0.6);
            animation: solar-flare 1s infinite alternate;
        }
        
        /* Realistic 3D Orbits */
        .real-orbit {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotateX(70deg);
            border: 1px solid;
            border-image: linear-gradient(90deg, 
                transparent, 
                rgba(0, 212, 255, 0.2), 
                transparent) 1;
            border-radius: 50%;
            pointer-events: none;
            transform-style: preserve-3d;
        }
        
        /* Photorealistic Planets */
        .planet-system {
            position: absolute;
            top: 50%;
            left: 50%;
            transform-origin: center;
            transform-style: preserve-3d;
            will-change: transform;
        }
        
        .real-planet {
            position: absolute;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: white;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8);
            overflow: hidden;
            transform-style: preserve-3d;
            transition: var(--transition-physics);
            box-shadow: 
                inset 0 0 40px rgba(255, 255, 255, 0.15),
                0 0 30px rgba(255, 255, 255, 0.1);
            filter: brightness(1.1) contrast(1.2);
        }
        
        .real-planet::before {
            content: '';
            position: absolute;
            top: -10%;
            left: -10%;
            right: -10%;
            bottom: -10%;
            background: radial-gradient(circle at 30% 30%, 
                rgba(255, 255, 255, 0.4) 0%,
                transparent 70%);
            opacity: 0.4;
            mix-blend-mode: overlay;
        }
        
        .real-planet:hover {
            transform: scale(1.6) translateZ(80px) !important;
            box-shadow: 
                0 0 80px currentColor,
                0 0 160px rgba(255, 255, 255, 0.4),
                inset 0 0 80px rgba(255, 255, 255, 0.3);
            filter: brightness(1.3) contrast(1.3);
            z-index: 1000;
        }
        
        .real-planet.selected {
            transform: scale(1.8) translateZ(120px) !important;
            box-shadow: 
                0 0 100px currentColor,
                0 0 200px rgba(255, 255, 255, 0.6),
                0 0 300px rgba(255, 255, 255, 0.4),
                inset 0 0 100px rgba(255, 255, 255, 0.5);
            animation: planet-pulse 2s infinite alternate;
            filter: brightness(1.5) contrast(1.4);
            z-index: 2000;
        }
        
        /* Realistic Planetary Features */
        .planet-features {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            overflow: hidden;
            opacity: 0.7;
            mix-blend-mode: overlay;
        }
        
        .clouds {
            background: radial-gradient(circle at 30% 30%, 
                rgba(255, 255, 255, 0.3) 0%,
                transparent 60%);
            animation: clouds-drift 20s infinite linear;
        }
        
        .storm-bands {
            background: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 5px,
                rgba(255, 255, 255, 0.1) 5px,
                rgba(255, 255, 255, 0.1) 10px
            );
            animation: bands-rotate 30s infinite linear;
        }
        
        .ice-caps {
            background: radial-gradient(circle at 50% 10%, 
                rgba(255, 255, 255, 0.4) 0%,
                transparent 40%),
                radial-gradient(circle at 50% 90%, 
                rgba(255, 255, 255, 0.4) 0%,
                transparent 40%);
        }
        
        /* Realistic Rings */
        .real-rings {
            position: absolute;
            border-radius: 50%;
            border: 3px solid;
            border-color: rgba(255, 255, 255, 0.7) transparent transparent transparent;
            transform: rotateX(75deg);
            pointer-events: none;
            filter: drop-shadow(0 0 30px rgba(255, 255, 255, 0.4));
            animation: rings-rotate 40s infinite linear;
        }
        
        /* Realistic Moons */
        .moon-system {
            position: absolute;
            transform-origin: center;
        }
        
        .real-moon {
            position: absolute;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, 
                #DDDDDD, #AAAAAA, #888888);
            box-shadow: inset 0 0 30px rgba(255, 255, 255, 0.3);
        }
        
        /* Scientific Data Panel */
        .science-panel {
            position: fixed;
            right: 0;
            top: 70px;
            width: 450px;
            height: calc(100vh - 150px);
            background: rgba(10, 14, 23, 0.92);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border-left: 1px solid var(--ui-border);
            padding: 30px;
            overflow-y: auto;
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 900;
            box-shadow: -8px 0 40px rgba(0, 0, 0, 0.3);
        }
        
        .science-panel.collapsed {
            transform: translateX(100%);
        }
        
        /* Professional Data Cards */
        .data-card {
            background: linear-gradient(135deg, 
                rgba(26, 34, 56, 0.7), 
                rgba(15, 21, 37, 0.7));
            border: 1px solid var(--ui-border);
            border-radius: 16px;
            padding: 25px;
            margin-bottom: 25px;
            transition: var(--transition-physics);
        }
        
        .data-card:hover {
            background: linear-gradient(135deg, 
                rgba(26, 34, 56, 0.9), 
                rgba(15, 21, 37, 0.9));
            border-color: var(--sci-cyan);
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(0, 212, 255, 0.15);
        }
        
        .card-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .card-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, var(--sci-blue), var(--sci-cyan));
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: white;
        }
        
        .card-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 18px;
            color: var(--sci-cyan);
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        /* Scientific Measurements */
        .measurement-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .measurement {
            background: rgba(0, 0, 0, 0.3);
            padding: 15px;
            border-radius: 10px;
            border-left: 4px solid var(--sci-green);
        }
        
        .measurement-value {
            font-family: 'Source Code Pro', monospace;
            font-size: 22px;
            font-weight: 700;
            color: var(--sci-green);
            margin-bottom: 5px;
        }
        
        .measurement-label {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.6);
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        /* Real-time Graphs */
        .graph-container {
            height: 200px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            position: relative;
            overflow: hidden;
            margin: 20px 0;
        }
        
        .graph-grid {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(to right, rgba(255, 255, 255, 0.05) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.05) 1px, transparent 1px);
            background-size: 20px 20px;
        }
        
        /* Control Panel */
        .control-panel {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 80px;
            background: rgba(10, 14, 23, 0.92);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border-top: 1px solid var(--ui-border);
            display: flex;
            align-items: center;
            padding: 0 40px;
            z-index: 800;
            box-shadow: 0 -4px 30px rgba(0, 0, 0, 0.3);
        }
        
        .control-group {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-right: 40px;
        }
        
        .control-label {
            font-family: 'Source Code Pro', monospace;
            font-size: 13px;
            color: var(--sci-cyan);
            text-transform: uppercase;
            letter-spacing: 2px;
            min-width: 120px;
        }
        
        /* Professional Slider */
        .sci-slider {
            width: 300px;
            position: relative;
        }
        
        .slider-track {
            width: 100%;
            height: 6px;
            background: linear-gradient(90deg, 
                rgba(0, 100, 255, 0.2), 
                rgba(0, 212, 255, 0.8));
            border-radius: 3px;
            position: relative;
            overflow: hidden;
        }
        
        .slider-track::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(90deg, 
                transparent, 
                rgba(255, 255, 255, 0.4), 
                transparent);
            animation: slider-shimmer 3s infinite linear;
        }
        
        .time-slider {
            -webkit-appearance: none;
            width: 100%;
            height: 6px;
            background: transparent;
            outline: none;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 2;
        }
        
        .time-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: white;
            border: 3px solid var(--sci-cyan);
            cursor: pointer;
            box-shadow: 
                0 0 30px var(--sci-cyan),
                0 0 60px rgba(0, 212, 255, 0.5);
            transition: var(--transition-physics);
        }
        
        .time-slider::-webkit-slider-thumb:hover {
            transform: scale(1.3);
            box-shadow: 
                0 0 40px var(--sci-cyan),
                0 0 80px rgba(0, 212, 255, 0.7);
        }
        
        /* Professional Buttons */
        .sci-button {
            background: linear-gradient(135deg, 
                rgba(26, 34, 56, 0.8), 
                rgba(15, 21, 37, 0.8));
            border: 1px solid var(--ui-border);
            color: var(--sci-cyan);
            padding: 12px 24px;
            border-radius: 8px;
            font-family: 'Exo 2', sans-serif;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: var(--transition-physics);
            display: flex;
            align-items: center;
            gap: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            position: relative;
            overflow: hidden;
        }
        
        .sci-button:hover {
            background: linear-gradient(135deg, 
                rgba(74, 144, 226, 0.2), 
                rgba(15, 21, 37, 0.8));
            border-color: var(--sci-cyan);
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 212, 255, 0.2);
        }
        
        .sci-button.active {
            background: linear-gradient(135deg, 
                var(--sci-blue), 
                var(--sci-cyan));
            color: white;
            border-color: transparent;
            box-shadow: 0 8px 30px rgba(0, 212, 255, 0.4);
        }
        
        .sci-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(45deg, 
                transparent, 
                rgba(255, 255, 255, 0.1), 
                transparent);
            transform: translateX(-100%);
        }
        
        .sci-button:hover::before {
            animation: button-shine 1s;
        }
        
        /* Status Bar */
        .status-bar {
            position: fixed;
            bottom: 80px;
            left: 0;
            width: 100%;
            height: 30px;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 40px;
            font-family: 'Source Code Pro', monospace;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.8);
            border-top: 1px solid var(--ui-border);
            border-bottom: 1px solid var(--ui-border);
            z-index: 700;
        }
        
        .status-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .status-value {
            color: var(--sci-green);
            font-weight: 700;
        }
        
        /* Heads-Up Display */
        .heads-up-display {
            position: fixed;
            top: 90px;
            left: 40px;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid var(--ui-border);
            border-radius: 12px;
            padding: 20px;
            width: 320px;
            z-index: 600;
        }
        
        .hud-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 16px;
            color: var(--sci-cyan);
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 10px;
        }
        
        /* Realistic Animations */
        @keyframes dust-drift {
            0% { transform: translate(0, 0) rotate(0deg); }
            100% { transform: translate(200px, 200px) rotate(360deg); }
        }
        
        @keyframes solar-activity {
            0% { 
                box-shadow: 
                    0 0 150px rgba(255, 215, 0, 0.9),
                    0 0 300px rgba(255, 140, 0, 0.7),
                    0 0 450px rgba(255, 69, 0, 0.5);
                filter: brightness(1.2) contrast(1.1);
            }
            100% { 
                box-shadow: 
                    0 0 180px rgba(255, 215, 0, 1),
                    0 0 350px rgba(255, 140, 0, 0.8),
                    0 0 500px rgba(255, 69, 0, 0.6);
                filter: brightness(1.3) contrast(1.2);
            }
        }
        
        @keyframes solar-flare {
            0%, 100% { 
                box-shadow: 
                    0 0 200px rgba(255, 215, 0, 1),
                    0 0 400px rgba(255, 140, 0, 0.8),
                    0 0 600px rgba(255, 69, 0, 0.6);
            }
            50% { 
                box-shadow: 
                    0 0 250px rgba(255, 215, 0, 1),
                    0 0 500px rgba(255, 140, 0, 0.9),
                    0 0 750px rgba(255, 69, 0, 0.7);
            }
        }
        
        @keyframes corona-pulse {
            0% { opacity: 0.3; transform: translate(-50%, -50%) scale(1); }
            100% { opacity: 0.7; transform: translate(-50%, -50%) scale(1.2); }
        }
        
        @keyframes planet-pulse {
            0% { 
                box-shadow: 
                    0 0 100px currentColor,
                    0 0 200px rgba(255, 255, 255, 0.6);
            }
            100% {

        // ====================== ULTRA-REALISTIC PHYSICS ENGINE ======================
        class RealisticPhysicsEngine {
            constructor() {
                // Real astronomical constants
                this.G = 6.67430e-11;     // Gravitational constant (m³/kg/s²)
                this.c = 299792458;       // Speed of light (m/s)
                this.AU = 149597870.7;    // Astronomical Unit (km)
                this.LY = 9.461e12;       // Light year (km)
                this.Mpc = 3.086e19;      // Megaparsec (km)
                
                // Solar constants
                this.SOLAR_MASS = 1.989e30;    // kg
                this.SOLAR_LUMINOSITY = 3.828e26; // W
                this.SOLAR_RADIUS = 696340;    // km
            }

            // Calculate orbital velocity using Newton's law of universal gravitation
            calculateOrbitalVelocity(mass, distance) {
                return Math.sqrt(this.G * mass / (distance * 1000)); // m/s
            }

            // Calculate orbital period using Kepler's third law
            calculateOrbitalPeriod(semiMajorAxis, parentMass) {
                return 2 * Math.PI * Math.sqrt(Math.pow(semiMajorAxis * 1000, 3) / (this.G * parentMass)); // seconds
            }

            // Calculate gravitational acceleration
            calculateSurfaceGravity(mass, radius) {
                return (this.G * mass) / Math.pow(radius * 1000, 2); // m/s²
            }

            // Calculate escape velocity
            calculateEscapeVelocity(mass, radius) {
                return Math.sqrt(2 * this.G * mass / (radius * 1000)); // m/s
            }

            // Calculate tidal forces
            calculateTidalForce(mass1, mass2, distance, radius) {
                return (2 * this.G * mass1 * radius) / Math.pow(distance * 1000, 3);
            }

            // Calculate Hill sphere radius
            calculateHillSphere(primaryMass, secondaryMass, distance) {
                return distance * Math.cbrt(secondaryMass / (3 * primaryMass));
            }

            // Calculate Roche limit
            calculateRocheLimit(primaryDensity, secondaryDensity, secondaryRadius) {
                return 2.44 * secondaryRadius * Math.cbrt(primaryDensity / secondaryDensity);
            }

            // Calculate black hole Schwarzschild radius
            calculateSchwarzschildRadius(mass) {
                return (2 * this.G * mass) / Math.pow(this.c, 2);
            }

            // Calculate time dilation (special relativity)
            calculateTimeDilation(velocity) {
                return 1 / Math.sqrt(1 - Math.pow(velocity / this.c, 2));
            }

            // Calculate orbital elements
            calculateOrbitalElements(semiMajorAxis, eccentricity, inclination, longitudeOfAscendingNode, argumentOfPeriapsis, meanAnomaly) {
                return {
                    semiMajorAxis,
                    eccentricity,
                    inclination,
                    longitudeOfAscendingNode,
                    argumentOfPeriapsis,
                    meanAnomaly,
                    trueAnomaly: this.calculateTrueAnomaly(eccentricity, meanAnomaly)
                };
            }

            calculateTrueAnomaly(eccentricity, meanAnomaly) {
                // Solve Kepler's equation for eccentric anomaly
                let E = meanAnomaly;
                for (let i = 0; i < 50; i++) {
                    E = meanAnomaly + eccentricity * Math.sin(E);
                }
                return 2 * Math.atan(Math.sqrt((1 + eccentricity) / (1 - eccentricity)) * Math.tan(E / 2));
            }
        }

                this.database.planets.forEach(planet => {
                    const orbitalVelocity = 360 / planet.orbitalPeriod;
                    this.simulationState.orbitalAngles.set(planet.name, Math.random() * 360);
                    this.simulationState.orbitalVelocities.set(planet.name, orbitalVelocity);
                    this.simulationState.axialRotations.set(planet.name, 360 / (Math.abs(planet.rotationPeriod) * 24));
                });

                // Hide loading screen
                setTimeout(() => {
                    document.getElementById('loading-screen').style.opacity = '0';
                    setTimeout(() => {
                        document.getElementById('loading-screen').style.display = 'none';
                    }, 1000);
                }, 2000);
            }

            createUltraRealisticStarfield() {
                const layers = ['stars-far', 'stars-medium', 'stars-near'];
                layers.forEach((layerId, index) => {
                    const layer = document.getElementById(layerId);
                    const starCount = 800 * (index + 1);
                    const sizeMultiplier = 0.3 + index * 0.7;
                    const speedMultiplier = 0.2 + index * 0.4;
                    
                    for (let i = 0; i < starCount; i++) {
                        const star = document.createElement('div');
                        star.className = 'star';
                        
                        // Realistic star sizes and brightness
                        const size = Math.random() ** 4 * 4 * sizeMultiplier + 0.5;
                        star.style.width = star.style.height = `${size}px`;
                        star.style.left = `${Math.random() * 100}%`;
                        star.style.top = `${Math.random() * 100}%`;
                        
                        // Realistic star colors (based on temperature)
                        const temperature = Math.random();
                        let color;
                        if (temperature > 0.8) {
                            color = '#ffffff'; // Hot blue-white stars
                        } else if (temperature > 0.6) {
                            color = '#fff8e7'; // White stars
                        } else if (temperature > 0.4) {
                            color = '#ffebb3'; // Yellow-white
                        } else if (temperature > 0.2) {
                            color = '#ffcc99'; // Orange
                        } else {
                            color = '#ff9966'; // Red
                        }
                        
                        star.style.backgroundColor = color;
                        star.style.boxShadow = `0 0 ${size * 3}px ${color}`;
                        
                        // Realistic twinkling (atmospheric scintillation)
                        const brightness = Math.random() ** 2;
                        star.style.opacity = brightness * 0.9 + 0.1;
                        
                        if (Math.random() > 0.2) {
                            const duration = Math.random() * 4 + 2;
                            const delay = Math.random() * 5;
                            star.style.animation = `twinkle ${duration}s infinite alternate ${delay}s`;
                        }
                        
                        layer.appendChild(star);
                    }
                });
            }

            createRealisticSolarSystem() {
                const container = document.getElementById('solar-system');
                container.innerHTML = '';
                this.planetElements = [];
                this.particles = [];

                // Create ultra-realistic Sun with solar wind
                const sun = document.createElement('div');
                sun.className = 'real-sun';
                sun.id = 'real-sun';
                sun.addEventListener('click', () => this.selectBody(this.database.sun));
                
                // Add solar features
                const sunFeatures = document.createElement('div');
                sunFeatures.className = 'planet-features clouds';
                sun.appendChild(sunFeatures);
                
                container.appendChild(sun);

                // Create solar wind particles
                this.createSolarWind();

                // Create realistic orbits and planets
                this.database.planets.forEach((planet, index) => {
                    // Calculate realistic visual scaling
                    const logDistance = Math.log10(planet.semiMajorAxis / 1e6);
                    const visualDistance = logDistance * 180 + 220;
                    const visualRadius = Math.log10(planet.radius) * 8 + 12;

                    // Create realistic orbit
                    if (this.showOrbits) {
                        const orbit = document.createElement('div');
                        orbit.className = 'real-orbit';
                        orbit.style.width = orbit.style.height = `${visualDistance * 2}px`;
                        orbit.style.marginLeft = orbit.style.marginTop = `-${visualDistance}px`;
                        orbit.style.borderColor = `rgba(0, 212, 255, ${0.1 + (0.1 * index/8)})`;
                        container.appendChild(orbit);
                    }

                    // Create planet system container
                    const planetSystem = document.createElement('div');
                    planetSystem.className = 'planet-system';
                    planetSystem.id = `planet-system-${index}`;
                    
                    // Calculate initial orbital position
                    const initialAngle = Math.random() * 360;
                    this.simulationState.orbitalAngles.set(planet.name, initialAngle);
                    this.simulationState.realPositions.set(planet.name, {
                        x: visualDistance * Math.cos(initialAngle * Math.PI / 180),
                        y: visualDistance * Math.sin(initialAngle * Math.PI / 180)
                    });

                    // Apply realistic orbital inclination
                    const inclination = planet.inclination || 0;
                    planetSystem.style.transform = 
                        `rotate(${initialAngle}deg) rotateX(${inclination}deg)`;

                    // Create ultra-realistic planet
                    const planetDiv = document.createElement('div');
                    planetDiv.className = 'real-planet';
                    planetDiv.id = `planet-${index}`;
                    planetDiv.style.width = planetDiv.style.height = `${visualRadius * 2}px`;
                    
                    // Apply realistic planet color with gradient
                    const gradientColors = this.getPlanetGradient(planet);
                    planetDiv.style.background = gradientColors;
                    
                    // Add planet icon
                    const planetIcon = document.createElement('div');
                    planetIcon.textContent = planet.icon;
                    planetIcon.style.fontSize = `${Math.max(visualRadius / 1.5, 18)}px`;
                    planetIcon.style.textShadow = '0 2px 10px rgba(0, 0, 0, 0.8)';
                    planetDiv.appendChild(planetIcon);

                    // Add realistic planetary features
                    this.addPlanetaryFeatures(planetDiv, planet);

                    // Add planet label
                    const label = document.createElement('div');
                    label.className = 'planet-label';
                    label.textContent = planet.name;
                    planetDiv.appendChild(label);

                    // Event listeners
                    planetDiv.addEventListener('click', () => this.selectBody(planet));
                    planetDiv.addEventListener('mouseenter', (e) => this.showDetailedInfo(e, planet));
                    planetDiv.addEventListener('mouseleave', () => this.hideDetailedInfo());

                    planetSystem.appendChild(planetDiv);
                    container.appendChild(planetSystem);

                    // Store reference
                    this.planetElements.push({
                        system: planetSystem,
                        planet: planetDiv,
                        data: planet,
                        distance: visualDistance,
                        radius: visualRadius
                    });

                    // Add moons for Earth
                    if (planet.name === 'Earth') {
                        this.addRealisticMoon(planetDiv, visualRadius, planet);
                    }

                    // Add rings for gas giants
                    if (planet.ringSystem) {
                        this.addPlanetaryRings(planetDiv, planet);
                    }
                });
            }

            getPlanetGradient(planet) {
                const colors = {
                    'Mercury': ['#8C7853', '#A8997A', '#756B56'],
                    'Venus': ['#FFC649', '#E6B245', '#CC9E41'],
                    'Earth': ['#2B65EC', '#1E56D5', '#1547BE'],
                    'Mars': ['#C1440E', '#A8370C', '#8F2B0A'],
                    'Jupiter': ['#E0AA70', '#C99B64', '#B28C58'],
                    'Saturn': ['#FAD5A5', '#E8C594', '#D6B583'],
                    'Uranus': ['#D1E7E7', '#B8D8D8', '#9FC9C9'],
                    'Neptune': ['#5B5BFF', '#4A4AE6', '#3939CC']
                };
                
                const planetColors = colors[planet.name] || ['#FFFFFF', '#CCCCCC'];
                return `radial-gradient(circle at 30% 30%, ${planetColors[0]} 0%, ${planetColors[1]} 40%, ${planetColors[2] || planetColors[1]} 70%)`;
            }

            addPlanetaryFeatures(planetElement, planetData) {
                const features = document.createElement('div');
                features.className = 'planet-features';
                
                if (planetData.name === 'Earth') {
                    features.classList.add('clouds');
                } else if (planetData.name === 'Jupiter' || planetData.name === 'Saturn') {
                    features.classList.add('storm-bands');
                } else if (planetData.name === 'Mars') {
                    features.classList.add('ice-caps');
                }
                
                planetElement.appendChild(features);
            }

            addPlanetaryRings(planetElement, planetData) {
                const rings = document.createElement('div');
                rings.className = 'real-rings';
                
                let ringSize;
                if (planetData.name === 'Saturn') {
                    ringSize = planetElement.offsetWidth * 2.5;
                } else if (planetData.name === 'Jupiter') {
                    ringSize = planetElement.offsetWidth * 2.2;
                } else {
                    ringSize = planetElement.offsetWidth * 2.0;
                }
                
                rings.style.width = rings.style.height = `${ringSize}px`;
                rings.style.marginLeft = rings.style.marginTop = `-${ringSize / 2}px`;
                
                planetElement.appendChild(rings);
            }

            addRealisticMoon(planetElement, planetRadius, planetData) {
                const moonSystem = document.createElement('div');
                moonSystem.className = 'moon-system';
                
                const moonOrbitRadius = planetRadius * 3;
                moonSystem.style.width = moonSystem.style.height = `${moonOrbitRadius * 2}px`;
                moonSystem.style.marginLeft = moonSystem.style.marginTop = `-${moonOrbitRadius}px`;
                
                const moon = document.createElement('div');
                moon.className = 'real-moon';
                const moonRadius = planetRadius * 0.4;
                moon.style.width = moon.style.height = `${moonRadius * 2}px`;
                moon.style.transform = `translate(${moonOrbitRadius}px, 0px)`;
                
                // Add realistic moon features
                const moonFeatures = document.createElement('div');
                moonFeatures.className = 'planet-features';
                moonFeatures.style.background = 'radial-gradient(circle at 30% 30%, #AAAAAA, #666666)';
                moonFeatures.style.opacity = '0.6';
                moon.appendChild(moonFeatures);
                
                moonSystem.appendChild(moon);
                planetElement.appendChild(moonSystem);
                
                this.simulationState.moonAngles.set(planetData.name, 0);
            }

            createSolarWind() {
                // Create solar wind particles
                for (let i = 0; i < 50; i++) {
                    setTimeout(() => {
                        const particle = document.createElement('div');
                        particle.className = 'solar-wind';
                        
                        // Random position around sun
                        const angle = Math.random() * Math.PI * 2;
                        const distance = 100 + Math.random() * 300;
                        
                        particle.style.left = '50%';
                        particle.style.top = '50%';
                        particle.style.setProperty('--particle-x', `${Math.cos(angle) * distance}px`);
                        particle.style.setProperty('--particle-y', `${Math.sin(angle) * distance}px`);
                        
                        document.querySelector('.simulation-container').appendChild(particle);
                        
                        setTimeout(() => particle.remove(), 3000);
                    }, i * 100);
                }
            }

            animate(currentTime = 0) {
                // Calculate FPS with high precision
                this.frameCount++;
                if (currentTime - this.lastFpsUpdate >= 1000) {
                    this.fps = Math.round((this.frameCount * 1000) / (currentTime - this.lastFpsUpdate));
                    document.getElementById('fps-counter').textContent = this.fps;
                    this.frameCount = 0;
                    this.lastFpsUpdate = currentTime;
                }

                if (this.isRunning) {
                    // Update simulation time (in days)
                    const deltaTime = (currentTime - this.lastFrameTime) || 16.67;
                    this.simulationTime += (deltaTime * this.timeScale) / (1000 * 86400); // Convert ms to days
                    
                    // Update simulation time display
                    const days = Math.floor(this.simulationTime);
                    const years = (days / 365.25).toFixed(2);
                    document.getElementById('sim-time').textContent = `${days.toLocaleString()} days (${years} years)`;

                    // Update real-time positions with Keplerian physics
                    this.updatePlanetaryPositions(deltaTime);

                    // Update solar wind particles
                    this.updateParticles();

                    // Update telemetry data
                    this.updateTelemetry();
                }

                this.lastFrameTime = currentTime;
                this.animationId = requestAnimationFrame((time) => this.animate(time));
            }

            updatePlanetaryPositions(deltaTime) {
                const timeFactor = (deltaTime / 16.67) * this.timeScale * 0.01;

                this.planetElements.forEach((item) => {
                    const planet = item.data;
                    
                    // Get current angles
                    let orbitalAngle = this.simulationState.orbitalAngles.get(planet.name) || 0;
                    let axialRotation = this.simulationState.axialRotations.get(planet.name) || 0;
                    
                    // Update orbital position with elliptical orbit
                    const meanMotion = 360 / planet.orbitalPeriod;
                    orbitalAngle = (orbitalAngle + meanMotion * timeFactor) % 360;
                    this.simulationState.orbitalAngles.set(planet.name, orbitalAngle);
                    
                    // Update axial rotation (consider retrograde rotation)
                    const rotationDirection = planet.rotationPeriod < 0 ? -1 : 1;
                    let currentRotation = parseFloat(
                        item.planet.style.transform.match(/rotate\(([^)]+)deg\)/)?.[1] || 0
                    );
                    currentRotation = (currentRotation + axialRotation * timeFactor * rotationDirection) % 360;
                    
                    // Apply transforms with 3D effects
                    const inclination = planet.inclination || 0;
                    const axialTilt = planet.axialTilt || 0;
                    
                    item.system.style.transform = 
                        `rotate(${orbitalAngle}deg) rotateX(${inclination}deg)`;
                    
                    item.planet.style.transform = 
                        `translate(${item.distance}px, 0px) rotate(${currentRotation}deg) rotateX(${axialTilt}deg)`;
                    
                    // Update moon positions
                    if (planet.name === 'Earth') {
                        let moonAngle = this.simulationState.moonAngles.get(planet.name) || 0;
                        moonAngle = (moonAngle + 13.2 * timeFactor) % 360;
                        this.simulationState.moonAngles.set(planet.name, moonAngle);
                        
                        const moon = item.planet.querySelector('.moon-system');
                        if (moon) {
                            moon.style.transform = `rotate(${moonAngle}deg)`;
                        }
                    }
                    
                    // Update real position for physics calculations
                    const distance = item.distance;
                    const x = distance * Math.cos(orbitalAngle * Math.PI / 180);
                    const y = distance * Math.sin(orbitalAngle * Math.PI / 180);
                    this.simulationState.realPositions.set(planet.name, { x, y });
                });
            }

            updateParticles() {
                // Occasionally create new solar wind particles
                if (Math.random() > 0.97) {
                    this.createSolarWind();
                }
            }

            selectBody(body) {
                this.selectedBody = body;
                
                // Update visual selection
                document.querySelectorAll('.real-planet, .real-sun').forEach(el => {
                    el.classList.remove('selected');
                });
                
                if (body === this.database.sun) {
                    document.getElementById('real-sun').classList.add('selected');
                } else {
                    const planetElement = this.planetElements.find(p => p.data.name === body.name);
                    if (planetElement) {
                        planetElement.planet.classList.add('selected');
                    }
                }
                
                this.updateSciencePanel();
                this.updateHUD();
                this.updateStatusBar();
            }

                                    <div style="display: flex; justify-content: space-between;">

                                ${body.name}
                            </div>
                            <div style="color: rgba(255,255,255,0.7); font-size: 14px; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 20px;">
                                ${body.type}
                            </div>
                        </div>
                        
                        <div class="measurement-grid">
                            <div class="measurement">
                                <div class="measurement-value">${(body.radius / 1000).toFixed(1)}</div>
                                <div class="measurement-label">Radius (thousand km)</div>
                            </div>
                            <div class="measurement">
                                <div class="measurement-value">${(body.mass / this.database.SOLAR_MASS).toExponential(2)}</div>
                                <div class="measurement-label">Mass (Solar Masses)</div>
                            </div>
                            <div class="measurement">
                                <div class="measurement-value">${measurements.orbitalVelocity.toFixed(1)}</div>
                                <div class="measurement-label">Orbital Velocity (km/s)</div>

                            <div class="measurement">
                                <div class="measurement-value">${measurements.surfaceGravity.toFixed(1)}</div>

                            ${body.orbitalPeriod ? `

                    </div>
                    
                    <div class="data-card">
                        <div class="card-header">
                            <div class="card-icon">
                                <i class="fas fa-atom"></i>

                            <div class="card-title">Composition & Structure</div>
                        </div>
                        
                        <div style="margin-top: 15px;">
                            ${compositionHTML || '<div style="color: rgba(255,255,255,0.6);">No composition data available</div>'}
                        </div>
                        
                        ${body.atmosphere ? `
                        <div style="margin-top: 20px;">
                            <div style="font-size: 13px; color: var(--sci-cyan); margin-bottom: 10px; text-transform: uppercase; letter-spacing: 1px;">
                                Atmosphere
                            </div>
                            <div style="color: rgba(255,255,255,0.8); font-size: 13px;">
                                Pressure: ${body.atmosphere.pressure} bar
                            </div>
                        </div>
                        ` : ''}
                    </div>
                    
                    <div class="data-card">
                        <div class="card-header">
                            <div class="card-icon">
                                <i class="fas fa-satellite"></i>
                            </div>
                            <div class="card-title">Exploration History</div>
                        </div>
                        
                        <div style="margin-top: 15px;">
                            <div style="color: rgba(255,255,255,0.8); font-size: 13px; margin-bottom: 10px;">
                                ${body.discovery ? `Discovered: ${body.discovery}` : 'Known since antiquity'}
                            </div>
                            ${body.exploration ? `
                            <div style="color: var(--sci-green); font-size: 13px; margin-bottom: 5px;">
                                Missions:
                            </div>
                            <div style="color: rgba(255,255,255,0.7); font-size: 12px;">

                            ` : ''}
                        </div>
                    </div>
                `;
            }

            calculateScientificMeasurements(body) {
                if (body === this.database.sun) {
                    return {
                        orbitalVelocity: 0,
                        surfaceGravity: body.surfaceGravity,
                        escapeVelocity: body.escapeVelocity,
                        orbitalPeriod: 0
                    };
                }
                
                const orbitalVelocity = this.database.calculateOrbitalVelocity(body) / 1000; // Convert to km/s
                const surfaceGravity = this.database.calculateSurfaceGravity(body);
                const escapeVelocity = this.database.calculateEscapeVelocity(body) / 1000; // Convert to km/s
                
                return {
                    orbitalVelocity: orbitalVelocity.toFixed(1),
                    surfaceGravity: surfaceGravity.toFixed(1),
                    escapeVelocity: escapeVelocity.toFixed(1),
                    orbitalPeriod: body.orbitalPeriod
                };
            }

            updateTelemetry() {
                // This would update real-time telemetry data
                // For now, we'll just update the selected object display
                document.getElementById('selected-object').textContent = this.selectedBody.name;
            }

            updateHUD() {
                const hud = document.getElementById('hud-content');
                const timeDilation = this.physics.calculateTimeDilation(0); // For now, no relativistic speeds
                
                hud.innerHTML = `
                    <div style="margin-bottom: 15px;">
                        <div style="font-size: 11px; color: rgba(255,255,255,0.6); margin-bottom: 5px;">PHYSICS ENGINE</div>
                        <div style="font-family: 'Source Code Pro'; font-size: 18px; color: var(--sci-green);">
                            ${this.timeScale >= 100 ? 'RELATIVISTIC' : 'NEWTONIAN'}
                        </div>
                    </div>
                    <div style="margin-bottom: 15px;">
                        <div style="font-size: 11px; color: rgba(255,255,255,0.6); margin-bottom: 5px;">TIME DILATION</div>
                        <div style="font-family: 'Source Code Pro'; font-size: 18px; color: var(--sci-cyan);">
                            ${timeDilation.toFixed(6)}x
                        </div>
                    </div>
                    <div>
                        <div style="font-size: 11px; color: rgba(255,255,255,0.6); margin-bottom: 5px;">SIMULATION ACCURACY</div>
                        <div style="font-family: 'Source Code Pro'; font-size: 14px; color: rgba(255,255,255,0.8);">
                            NASA-GRADE (${this.fps} FPS)
                        </div>
                    </div>
                `;
            }

            updateStatusBar() {
                document.getElementById('physics-status').textContent = 
                    this.timeScale >= 100 ? 'RELATIVISTIC' : 'NEWTONIAN';
            }

            setupRealTimeClock() {
                const updateClock = () => {
                    const now = new Date();
                    const utcTime = now.toUTCString().split(' ')[4];
                    const dateStr = now.toISOString().split('T')[0];
                    document.getElementById('real-time-clock').innerHTML = `
                        <div style="display: flex; align-items: center; gap: 10px;">
                            <i class="fas fa-clock"></i>
                            <div>
                                <div style="font-size: 12px;">${dateStr}</div>
                                <div style="font-size: 16px; color: var(--sci-green);">${utcTime} UTC</div>
                            </div>
                        </div>
                    `;
                };
                
                updateClock();
                setInterval(updateClock, 1000);
            }

            setupEventListeners() {
                // Time scale slider
                const timeSlider = document.getElementById('time-scale');
                timeSlider.addEventListener('input', (e) => {
                    this.timeScale = parseFloat(e.target.value);
                    document.getElementById('time-display').textContent = `${this.timeScale.toFixed(2)}x`;
                    this.updateHUD();
                    this.updateStatusBar();
                });

                // Keyboard controls
                document.addEventListener('keydown', (e) => {
                    switch(e.key) {
                        case ' ':
                            e.preventDefault();
                            this.toggleSimulation();
                            break;
                        case 'r':
                        case 'R':
                            this.resetSimulation();
                            break;
                        case 'o':
                        case 'O':
                            this.toggleOrbits();
                            break;
                        case 'ArrowUp':
                            e.preventDefault();
                            this.timeScale = Math.min(this.timeScale * 1.5, 1000);
                            timeSlider.value = this.timeScale;
                            document.getElementById('time-display').textContent = `${this.timeScale.toFixed(2)}x`;
                            break;
                        case 'ArrowDown':
                            e.preventDefault();
                            this.timeScale = Math.max(this.timeScale / 1.5, 0.01);
                            timeSlider.value = this.timeScale;
                            document.getElementById('time-display').textContent = `${this.timeScale.toFixed(2)}x`;
                            break;
                        case '1':
                            this.selectBody(this.database.sun);
                            break;
                        case '2':
                        case '3':
                        case '4':
                        case '5':
                        case '6':
                        case '7':
                        case '8':
                        case '9':
                            const index = parseInt(e.key) - 2;
                            if (index >= 0 && index < this.database.planets.length) {
                                this.selectBody(this.database.planets[index]);
                            }
                            break;
                        case 'Escape':
                            document.getElementById('science-panel').classList.toggle('collapsed');
                            break;
                    }
                });
            }

            toggleSimulation() {
                this.isRunning = !this.isRunning;
                const btn = document.querySelector('.sci-button i.fa-pause, .sci-button i.fa-play');
                if (btn) {
                    btn.className = this.isRunning ? 'fas fa-pause' : 'fas fa-play';
                    btn.parentElement.querySelector('span').textContent = this.isRunning ? 'PAUSE' : 'PLAY';
                }
            }

            resetSimulation() {
                this.simulationTime = 0;
                this.timeScale = 1.0;
                document.getElementById('time-scale').value = 1.0;
                document.getElementById('time-display').textContent = '1.00x';
                
                // Reset all planet positions
                this.planetElements.forEach((item) => {
                    const initialAngle = Math.random() * 360;
                    this.simulationState.orbitalAngles.set(item.data.name, initialAngle);
                    const inclination = item.data.inclination || 0;
                    item.system.style.transform = `rotate(${initialAngle}deg) rotateX(${inclination}deg)`;
                });
                
                this.selectBody(this.database.sun);
            }

            toggleOrbits() {
                this.showOrbits = !this.showOrbits;
                const btn = document.querySelector('.sci-button i.fa-circle');
                if (btn) {
                    btn.parentElement.classList.toggle('active', this.showOrbits);
                }
                this.createRealisticSolarSystem();
                this.selectBody(this.selectedBody);
            }

            showDetailedInfo(event, planet) {
                // Create floating detailed info panel
                const info = document.createElement('div');
                info.style.position = 'absolute';
                info.style.left = `${event.pageX + 20}px`;
                info.style.top = `${event.pageY + 20}px`;
                info.style.background = 'rgba(0, 0, 0, 0.95)';
                info.style.backdropFilter = 'blur(10px)';
                info.style.border = '1px solid var(--sci-cyan)';
                info.style.borderRadius = '8px';
                info.style.padding = '20px';
                info.style.zIndex = '10000';
                info.style.maxWidth = '300px';
                info.style.boxShadow = '0 10px 40px rgba(0, 0, 0, 0.5)';
                
                const measurements = this.calculateScientificMeasurements(planet);
                
                info.innerHTML = `
                    <div style="margin-bottom: 15px;">
                        <div style="font-family: 'Orbitron'; color: var(--sci-cyan); font-size: 18px; margin-bottom: 5px;">
                            ${planet.name}
                        </div>
                        <div style="color: rgba(255,255,255,0.7); font-size: 12px; text-transform: uppercase; letter-spacing: 1px;">
                            ${planet.type}
                        </div>
                    </div>
                    
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px;">
                        <div>
                            <div style="font-size: 11px; color: rgba(255,255,255,0.6);">Distance from Sun</div>
                            <div style="font-family: 'Source Code Pro'; color: var(--sci-green);">${(planet.semiMajorAxis / 1e6).toFixed(1)} Mkm</div>
                        </div>
                        <div>
                            <div style="font-size: 11px; color: rgba(255,255,255,0.6);">Orbital Velocity</div>
                            <div style="font-family: 'Source Code Pro'; color: var(--sci-green);">${measurements.orbitalVelocity} km/s</div>
                        </div>
                    </div>
                    
                    <div style="font-size: 12px; color: rgba(255,255,255,0.8);">
                        ${planet.name} is ${planet.type.toLowerCase()} with ${planet.moons || 0} known moon${planet.moons !== 1 ? 's' : ''}.
                    </div>
                `;
                
                document.body.appendChild(info);
                this.currentInfoPanel = info;
                
                // Remove on mouse leave
                event.target.addEventListener('mouseleave', () => {
                    if (this.currentInfoPanel) {
                        this.currentInfoPanel.remove();
                        this.currentInfoPanel = null;
                    }
                }, { once: true });
            }

            hideDetailedInfo() {
                if (this.currentInfoPanel) {
                    this.currentInfoPanel.remove();
                    this.currentInfoPanel = null;
                }
            }
        }

        // ====================== GLOBAL FUNCTIONS ======================
        let simulator;

        function init() {
            simulator = new UltraRealisticSolarSystem();
        }

        function toggleSimulation() {
            simulator.toggleSimulation();
        }

        function resetSimulation() {
            simulator.resetSimulation();
        }

        function toggleOrbits() {
            simulator.toggleOrbits();
        }

        function toggleSciencePanel() {
            document.getElementById('science-panel').classList.toggle('collapsed');
        }

        // Initialize on load
        window.addEventListener('load', init);

        // Add missing CSS animations
        const style = document.createElement('style');
        style.textContent = `
            @keyframes twinkle {
                0% { opacity: 0.3; transform: scale(1); }
                100% { opacity: 1; transform: scale(1.1); }
            }
            
            @keyframes particle-flow {
                0% { 
                    transform: translate(0, 0) scale(1);
                    opacity: 1;
                }
                100% { 
                    transform: translate(var(--particle-x, 100px), var(--particle-y, 100px)) scale(0);
                    opacity: 0;
                }
            }
        `;
        document.head.appendChild(style);
    </script>
</body>
</html>
