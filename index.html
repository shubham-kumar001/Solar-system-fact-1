<html lang="en">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #000;
            color: white;
            overflow: hidden;
            height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        /* Loading Screen */
        .loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 1s;
        }

        .loading-spinner {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(0, 100, 255, 0.3);
            border-top-color: #00a8ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        /* Header */
        .header {
            position: fixed;
            top: 0;
            width: 100%;
            padding: 15px 30px;
            background: rgba(0, 10, 30, 0.9);
            backdrop-filter: blur(10px);
            z-index: 1000;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(0, 150, 255, 0.3);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo-icon {
            font-size: 28px;
            color: #00a8ff;
            animation: pulse 2s infinite;
        }

        .logo-text {
            font-size: 20px;
            font-weight: 700;
            background: linear-gradient(90deg, #00a8ff, #0097e6);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .controls {
            display: flex;
            gap: 10px;
        }

        .control-btn {
            background: rgba(0, 40, 80, 0.7);
            border: 1px solid rgba(0, 150, 255, 0.3);
            color: #00a8ff;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .control-btn:hover {
            background: rgba(0, 80, 160, 0.7);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 150, 255, 0.2);
        }

        .control-btn.active {
            background: linear-gradient(90deg, #00a8ff, #0097e6);
            color: white;
            border-color: transparent;
        }

        /* Main Container */
        .container {
            display: flex;
            height: 100vh;
            padding-top: 70px;
        }

        /* 3D Solar System View */
        .solar-system-view {
            flex: 1;
            position: relative;
            overflow: hidden;
            background: radial-gradient(circle at center, #000 0%, #001020 70%);
        }

        #solar-system {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 1200px;
            height: 1200px;
        }

        /* Information Panel */
        .info-panel {
            width: 350px;
            background: rgba(0, 10, 30, 0.9);
            backdrop-filter: blur(10px);
            border-left: 1px solid rgba(0, 150, 255, 0.3);
            padding: 20px;
            overflow-y: auto;
        }

        .planet-info {
            text-align: center;
            margin-bottom: 30px;
        }

        .planet-icon {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            margin: 0 auto 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            font-weight: bold;
            color: white;
            box-shadow: 0 0 30px currentColor;
            animation: float 3s ease-in-out infinite;
        }

        .planet-name {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 5px;
            background: linear-gradient(90deg, #00a8ff, #00ffaa);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .planet-type {
            color: #66c0ff;
            font-size: 14px;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .planet-stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 25px;
        }

        .stat {
            background: rgba(0, 30, 60, 0.5);
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            border: 1px solid rgba(0, 150, 255, 0.2);
            transition: all 0.3s;
        }

        .stat:hover {
            transform: translateY(-2px);
            border-color: #00a8ff;
            box-shadow: 0 5px 15px rgba(0, 168, 255, 0.2);
        }

        .stat-value {
            font-size: 18px;
            font-weight: 700;
            color: #00ffaa;
            margin-bottom: 5px;
        }

        .stat-label {
            font-size: 12px;
            color: #88aacc;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Speed Control */
        .speed-control {
            background: rgba(0, 30, 60, 0.5);
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            border: 1px solid rgba(0, 150, 255, 0.2);
        }

        .slider {
            width: 100%;
            margin: 10px 0;
            -webkit-appearance: none;
            height: 6px;
            background: linear-gradient(90deg, rgba(0, 168, 255, 0.3), rgba(0, 168, 255, 0.8));
            border-radius: 3px;
            outline: none;
        }

        .slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #00a8ff;
            cursor: pointer;
            box-shadow: 0 0 10px #00a8ff;
            transition: all 0.3s;
        }

        .slider::-webkit-slider-thumb:hover {
            transform: scale(1.2);
            box-shadow: 0 0 20px #00a8ff;
        }

        /* Solar System Elements */
        .starfield {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle 3s infinite alternate;
        }

        .sun {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 120px;
            height: 120px;
            background: radial-gradient(circle at 30% 30%, #ffdd00, #ff6600);
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 
                0 0 100px #ffaa00,
                0 0 200px rgba(255, 170, 0, 0.5),
                0 0 300px rgba(255, 170, 0, 0.2);
            animation: sun-pulse 3s infinite alternate;
            transition: all 0.3s;
            z-index: 100;
        }

        .sun:hover {
            transform: translate(-50%, -50%) scale(1.1);
            box-shadow: 
                0 0 150px #ffaa00,
                0 0 250px rgba(255, 170, 0, 0.6),
                0 0 350px rgba(255, 170, 0, 0.3);
        }

        .sun.selected {
            outline: 3px solid #00ffaa;
            outline-offset: 10px;
        }

        .orbit {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border: 1px solid rgba(0, 150, 255, 0.1);
            border-radius: 50%;
            pointer-events: none;
        }

        .orbit.active {
            border-color: rgba(0, 168, 255, 0.3);
            animation: orbit-pulse 2s infinite;
        }

        .planet-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform-origin: center;
        }

        .planet {
            position: absolute;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: white;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.5);
            transition: all 0.3s;
            overflow: hidden;
            box-shadow: 
                inset 0 0 20px rgba(255, 255, 255, 0.1),
                0 0 20px rgba(255, 255, 255, 0.1);
            z-index: 10;
        }

        .planet:hover {
            transform: scale(1.3) !important;
            box-shadow: 
                0 0 40px currentColor,
                inset 0 0 40px rgba(255, 255, 255, 0.2);
            z-index: 100;
        }

        .planet.selected {
            transform: scale(1.4) !important;
            outline: 3px solid #00ffaa;
            outline-offset: 5px;
            box-shadow: 
                0 0 60px currentColor,
                0 0 120px rgba(255, 255, 255, 0.3),
                inset 0 0 60px rgba(255, 255, 255, 0.2);
            animation: selected-pulse 2s infinite;
            z-index: 1000;
        }

        .planet-label {
            position: absolute;
            top: -25px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 10, 30, 0.8);
            padding: 3px 10px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 600;
            color: #88ccff;
            border: 1px solid rgba(0, 150, 255, 0.3);
            white-space: nowrap;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .planet:hover .planet-label {
            opacity: 1;
        }

        .ring {
            position: absolute;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.5);
            transform: rotateX(75deg);
            pointer-events: none;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
        }

        .moon {
            position: absolute;
            border-radius: 50%;
            background: #cccccc;
            cursor: pointer;
        }

        /* Status Bar */
        .status-bar {
            position: fixed;
            bottom: 0;
            width: 100%;
            padding: 10px 30px;
            background: rgba(0, 10, 30, 0.9);
            backdrop-filter: blur(10px);
            border-top: 1px solid rgba(0, 150, 255, 0.3);
            font-size: 12px;
            color: #88aacc;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
        }

        .status-info {
            display: flex;
            gap: 20px;
        }

        .status-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .status-item i {
            color: #00a8ff;
        }

        /* Animations */
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        @keyframes sun-pulse {
            0% { 
                box-shadow: 
                    0 0 100px #ffaa00,
                    0 0 200px rgba(255, 170, 0, 0.5),
                    0 0 300px rgba(255, 170, 0, 0.2);
            }
            100% { 
                box-shadow: 
                    0 0 150px #ffaa00,
                    0 0 250px rgba(255, 170, 0, 0.6),
                    0 0 350px rgba(255, 170, 0, 0.3);
            }
        }

        @keyframes twinkle {
            0% { opacity: 0.3; }
            100% { opacity: 1; }
        }

        @keyframes orbit-pulse {
            0%, 100% { border-color: rgba(0, 168, 255, 0.3); }
            50% { border-color: rgba(0, 168, 255, 0.1); }
        }

        @keyframes selected-pulse {
            0%, 100% { outline-color: #00ffaa; }
            50% { outline-color: #00a8ff; }
        }

        @keyframes orbit {
            from { transform: translate(-50%, -50%) rotate(0deg); }
            to { transform: translate(-50%, -50%) rotate(360deg); }
        }

        /* Responsive */
        @media (max-width: 1200px) {
            .info-panel {
                width: 300px;
            }
            
            #solar-system {
                transform: translate(-50%, -50%) scale(0.8);
            }
        }

        @media (max-width: 768px) {
            .container {
                flex-direction: column;
            }
            
            .info-panel {
                width: 100%;
                height: 40vh;
            }
            
            .header {
                padding: 10px 15px;
            }
            
            .logo-text {
                font-size: 16px;
            }
            
            .control-btn span {
                display: none;
            }
            
            .control-btn {
                padding: 8px;
                width: 40px;
                height: 40px;
                justify-content: center;
            }
        }

        /* Tooltip */
        .tooltip {
            position: absolute;
            background: rgba(0, 20, 40, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 150, 255, 0.3);
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 12px;
            color: #88ccff;
            pointer-events: none;
            z-index: 10000;
            opacity: 0;
            transition: opacity 0.3s;
            white-space: nowrap;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }

        .tooltip.show {
            opacity: 1;
        }
    </style>
</head>

                    type: "Ice Giant",
                    icon: "♆",
                    color: "#5b5bff",
                    radius: 24,
                    distance: 560,
                    realRadius: 24622,
                    realDistance: 4495.1,
                    orbitalPeriod: 60190,
                    tilt: 28.32,
                    rotation: 0.671,
                    description: "The windiest planet",
                    stats: [
                        { label: "Mass", value: "1.024 × 10²⁶ kg" },
                        { label: "Diameter", value: "49,244 km" },
                        { label: "Orbital Period", value: "164.8 years" },
                        { label: "Rotation Period", value: "16h 6m" },
                        { label: "Surface Gravity", value: "11.15 m/s²" },
                        { label: "Cloud Temp", value: "-201°C" }
                    ],
                    hasRings: true,
                    hasMoon: true,
                    moonCount: 14
                }
            ]
        };

        // ========== GLOBAL VARIABLES ==========
        let animationRunning = true;
        let animationSpeed = 1.0;
        let realScaleMode = false;
        let showOrbits = true;
        let selectedBody = solarSystemData.sun;
        let animationFrameId = null;
        let lastFrameTime = 0;
        let fps = 60;
        let frameCount = 0;
        let lastFpsUpdate = 0;
        let planetElements = [];
        let time = 0;

        // ========== INITIALIZATION ==========
        function init() {
            createStarfield();
            createSolarSystem();
            selectBody(solarSystemData.sun);
            animate();
            
            // Hide loading screen after 1.5 seconds
            setTimeout(() => {
                document.getElementById('loading-screen').style.opacity = '0';
                setTimeout(() => {
                    document.getElementById('loading-screen').style.display = 'none';
                }, 1000);
            }, 1500);
            
            // Setup keyboard shortcuts
            setupKeyboardControls();
        }

        // ========== STARFIELD CREATION ==========
        function createStarfield() {
            const starfield = document.getElementById('starfield');
            for (let i = 0; i < 1500; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                const size = Math.random() * 2 + 0.5;
                star.style.width = star.style.height = `${size}px`;
                star.style.left = `${Math.random() * 100}%`;
                star.style.top = `${Math.random() * 100}%`;
                star.style.opacity = Math.random() * 0.7 + 0.3;
                star.style.animationDelay = `${Math.random() * 3}s`;
                starfield.appendChild(star);
            }
        }

        // ========== SOLAR SYSTEM CREATION ==========
        function createSolarSystem() {
            const solarSystem = document.getElementById('solar-system');
            solarSystem.innerHTML = '';
            planetElements = [];

            // Create Sun
            const sun = document.createElement('div');
            sun.className = 'sun';
            sun.id = 'sun';
            sun.style.width = sun.style.height = `${solarSystemData.sun.radius * 2}px`;
            sun.style.background = `radial-gradient(circle at 30% 30%, ${solarSystemData.sun.color}, #ff6600)`;
            sun.onclick = () => selectBody(solarSystemData.sun);
            solarSystem.appendChild(sun);

            // Create planets
            solarSystemData.planets.forEach((planet, index) => {
                const distance = realScaleMode ? 
                    (planet.realDistance / 10) * 2 : 
                    planet.distance;
                
                const radius = realScaleMode ? 
                    Math.max(planet.realRadius / 5000, 2) : 
                    planet.radius;

                // Create orbit
                const orbit = document.createElement('div');
                orbit.className = 'orbit';
                orbit.id = `orbit-${index}`;
                orbit.style.width = orbit.style.height = `${distance * 2}px`;
                orbit.style.marginLeft = orbit.style.marginTop = `-${distance}px`;
                orbit.style.display = showOrbits ? 'block' : 'none';
                solarSystem.appendChild(orbit);

                // Create planet container
                const planetContainer = document.createElement('div');
                planetContainer.className = 'planet-container';
                planetContainer.id = `planet-container-${index}`;
                planetContainer.style.transform = `rotate(${Math.random() * 360}deg)`;
                solarSystem.appendChild(planetContainer);

                // Create planet
                const planetDiv = document.createElement('div');
                planetDiv.className = 'planet';
                planetDiv.id = `planet-${index}`;
                planetDiv.style.width = planetDiv.style.height = `${radius * 2}px`;
                planetDiv.style.background = `radial-gradient(circle at 30% 30%, ${planet.color}, ${darkenColor(planet.color, 30)})`;
                planetDiv.style.transform = `translate(${distance}px, 0px) rotate(${planet.tilt || 0}deg)`;
                planetDiv.textContent = planet.icon;
                planetDiv.style.fontSize = `${Math.max(radius / 1.5, 14)}px`;
                planetDiv.onclick = () => selectBody(planet);
                planetDiv.onmouseenter = (e) => showTooltip(e, planet.name);
                planetDiv.onmouseleave = hideTooltip;
                
                // Add label
                const label = document.createElement('div');
                label.className = 'planet-label';
                label.textContent = planet.name;
                planetDiv.appendChild(label);

                // Add ring for gas giants
                if (planet.hasRings) {
                    const ring = document.createElement('div');
                    ring.className = 'ring';
                    const ringSize = radius * (planet.name === 'Saturn' ? 2.5 : 2);
                    ring.style.width = ring.style.height = `${ringSize}px`;
                    ring.style.marginLeft = ring.style.marginTop = `-${ringSize / 2}px`;
                    planetDiv.appendChild(ring);
                }

                // Add moons for Earth
                if (planet.name === 'Earth' || planet.name === 'Mars') {
                    const moonCount = planet.name === 'Earth' ? 1 : 2;
                    for (let i = 0; i < moonCount; i++) {
                        const moonOrbit = document.createElement('div');
                        moonOrbit.className = 'orbit';
                        moonOrbit.style.width = moonOrbit.style.height = `${planet.moonDistance * 2}px`;
                        moonOrbit.style.marginLeft = moonOrbit.style.marginTop = `-${planet.moonDistance}px`;
                        moonOrbit.style.borderColor = 'rgba(255, 255, 255, 0.1)';
                        planetDiv.appendChild(moonOrbit);

                        const moon = document.createElement('div');
                        moon.className = 'moon';
                        moon.style.width = moon.style.height = `${planet.moonRadius}px`;
                        moon.style.background = '#cccccc';
                        moon.style.transform = `translate(${planet.moonDistance}px, 0px) rotate(${i * (180 / moonCount)}deg)`;
                        moonOrbit.appendChild(moon);
                    }
                }

                planetContainer.appendChild(planetDiv);
                planetElements.push({
                    container: planetContainer,
                    element: planetDiv,
                    planet: planet,
                    angle: Math.random() * 360,
                    moonAngle: 0
                });
            });
        }

        // ========== ANIMATION LOOP ==========
        function animate(currentTime = 0) {
            // Calculate FPS
            frameCount++;
            if (currentTime - lastFpsUpdate >= 1000) {
                fps = Math.round((frameCount * 1000) / (currentTime - lastFpsUpdate));
                document.getElementById('fps-counter').textContent = `FPS: ${fps}`;
                frameCount = 0;
                lastFpsUpdate = currentTime;
            }

            if (animationRunning) {
                time += 0.016 * animationSpeed; // 60 FPS base

                // Update planet positions with Kepler's laws approximation
                planetElements.forEach((item, index) => {
                    if (item.container) {
                        const planet = item.planet;
                        
                        // Calculate orbital speed based on Kepler's third law
                        // T² ∝ r³, so angular speed ∝ 1/√(r³)
                        const basePeriod = realScaleMode ? 
                            (planet.realDistance ** 1.5) / 1000 : 
                            planet.orbitalPeriod;
                        
                        const angleIncrement = (360 / basePeriod) * animationSpeed * 0.01;
                        item.angle = (item.angle + angleIncrement) % 360;
                        
                        // Apply orbital motion
                        item.container.style.transform = `rotate(${item.angle}deg)`;
                        
                        // Apply axial rotation
                        const rotationSpeed = 360 / (planet.rotation * 24); // degrees per hour
                        const currentRotation = parseFloat(item.element.style.transform.match(/rotate\(([^)]+)deg\)/)?.[1] || 0);
                        item.element.style.transform = 
                            `translate(${realScaleMode ? planet.realDistance / 10 * 2 : planet.distance}px, 0px) ` +
                            `rotate(${(currentRotation + rotationSpeed * animationSpeed * 0.1) % 360}deg)`;
                        
                        // Update moons
                        if (planet.hasMoon && planet.name === 'Earth') {
                            item.moonAngle = (item.moonAngle + 13.2 * animationSpeed * 0.01) % 360;
                            const moon = item.element.querySelector('.moon');
                            if (moon) {
                                moon.style.transform = `translate(${planet.moonDistance}px, 0px) rotate(${item.moonAngle}deg)`;
                            }
                        }
                    }
                });

                // Update orbit animations
                if (showOrbits) {
                    document.querySelectorAll('.orbit').forEach(orbit => {
                        orbit.style.animation = `orbit ${20 / animationSpeed}s linear infinite`;
                    });
                }
            }

            animationFrameId = requestAnimationFrame(animate);
        }

        // ========== UI FUNCTIONS ==========
        function selectBody(body) {
            selectedBody = body;
            
            // Update visual selection
            document.querySelectorAll('.planet, .sun').forEach(el => {
                el.classList.remove('selected');
            });
            
            if (body === solarSystemData.sun) {
                document.getElementById('sun').classList.add('selected');
            } else {
                const index = solarSystemData.planets.findIndex(p => p.name === body.name);
                if (index !== -1) {
                    document.getElementById(`planet-${index}`).classList.add('selected');
                }
            }
            
            updateInfoPanel();
            updateStatus();
        }

        function updateInfoPanel() {
            document.getElementById('planet-icon').style.background = 
                `linear-gradient(135deg, ${selectedBody.color}, ${darkenColor(selectedBody.color, 30)})`;
            document.getElementById('planet-icon').textContent = selectedBody.icon;
            document.getElementById('planet-name').textContent = selectedBody.name;
            document.getElementById('planet-type').textContent = selectedBody.type;
            
            const statsContainer = document.getElementById('planet-stats');
            statsContainer.innerHTML = '';
            
            selectedBody.stats.forEach(stat => {
                const statDiv = document.createElement('div');
                statDiv.className = 'stat';
                statDiv.innerHTML = `
                    <div class="stat-value">${stat.value}</div>
                    <div class="stat-label">${stat.label}</div>
                `;
                statsContainer.appendChild(statDiv);
            });
        }

        function updateStatus() {
            document.getElementById('selected-object').textContent = 
                `${selectedBody.name} - ${selectedBody.type}`;
            document.getElementById('animation-status').textContent = 
                `${animationRunning ? 'Playing' : 'Paused'} (${animationSpeed.toFixed(1)}x)`;
        }

        // ========== CONTROL FUNCTIONS ==========
        function toggleAnimation() {
            animationRunning = !animationRunning;
            const btn = document.querySelector('.control-btn i');
            btn.className = animationRunning ? 'fas fa-pause' : 'fas fa-play';
            updateStatus();
        }

        function resetView() {
            time = 0;
            animationSpeed = 1.0;
            document.getElementById('speed-slider').value = 1;
            selectBody(solarSystemData.sun);
            
            planetElements.forEach(item => {
                item.angle = 0;
                item.moonAngle = 0;
                if (item.container) {
                    item.container.style.transform = 'rotate(0deg)';
                }
            });
            
            updateStatus();
        }

        function toggleRealScale() {
            realScaleMode = !realScaleMode;
            const btn = document.querySelectorAll('.control-btn')[2];
            btn.innerHTML = realScaleMode ? 
                '<i class="fas fa-compress"></i><span>VISUAL SCALE</span>' : 
                '<i class="fas fa-expand"></i><span>REAL SCALE</span>';
            btn.classList.toggle('active', realScaleMode);
            
            createSolarSystem();
            selectBody(selectedBody);
            
            if (realScaleMode) {
                showNotification("Real Scale Mode: Distances are approximately to scale. Planets may appear very small.");
            }
        }

        function toggleOrbits() {
            showOrbits = !showOrbits;
            const btn = document.querySelectorAll('.control-btn')[3];
            btn.classList.toggle('active', showOrbits);
            
            document.querySelectorAll('.orbit').forEach(orbit => {
                orbit.style.display = showOrbits ? 'block' : 'none';
            });
        }

        function updateSpeed(value) {
            animationSpeed = parseFloat(value);
            updateStatus();
        }

        // ========== HELPER FUNCTIONS ==========
        function darkenColor(color, percent) {
            const num = parseInt(color.replace("#", ""), 16);
            const amt = Math.round(2.55 * percent);
            const R = (num >> 16) - amt;
            const G = (num >> 8 & 0x00FF) - amt;
            const B = (num & 0x0000FF) - amt;
            return `#${(0x1000000 + (R < 255 ? R < 1 ? 0 : R : 255) * 0x10000 +
                (G < 255 ? G < 1 ? 0 : G : 255) * 0x100 +
                (B < 255 ? B < 1 ? 0 : B : 255)).toString(16).slice(1)}`;
        }

        function showTooltip(event, text) {
            const tooltip = document.getElementById('tooltip');
            tooltip.textContent = text;
            tooltip.style.left = `${event.pageX + 10}px`;
            tooltip.style.top = `${event.pageY + 10}px`;
            tooltip.classList.add('show');
        }

        function hideTooltip() {
            document.getElementById('tooltip').classList.remove('show');
        }

        function showNotification(message) {
            // Create temporary notification
            const notification = document.createElement('div');
            notification.style.position = 'fixed';
            notification.style.top = '100px';
            notification.style.right = '30px';
            notification.style.background = 'rgba(0, 40, 80, 0.9)';
            notification.style.color = '#00ffaa';
            notification.style.padding = '15px 20px';
            notification.style.borderRadius = '8px';
            notification.style.border = '1px solid rgba(0, 150, 255, 0.3)';
            notification.style.backdropFilter = 'blur(10px)';
            notification.style.zIndex = '10000';
            notification.textContent = message;
            
            document.body.appendChild(notification);
            
            setTimeout(() => {
                notification.style.opacity = '0';
                notification.style.transition = 'opacity 0.5s';
                setTimeout(() => notification.remove(), 500);
            }, 3000);
        }

        // ========== KEYBOARD CONTROLS ==========
        function setupKeyboardControls() {
            document.addEventListener('keydown', (e) => {
                switch(e.key) {
                    case ' ':
                        e.preventDefault();
                        toggleAnimation();
                        break;
                    case 'r':
                    case 'R':
                        resetView();
                        break;
                    case 's':
                    case 'S':
                        toggleRealScale();
                        break;
                    case 'o':
                    case 'O':
                        toggleOrbits();
                        break;
                    case '1':
                        selectBody(solarSystemData.sun);
                        break;
                    case '2':
                    case '3':
                    case '4':
                    case '5':
                    case '6':
                    case '7':
                    case '8':
                    case '9':
                        const index = parseInt(e.key) - 2;
                        if (index >= 0 && index < solarSystemData.planets.length) {
                            selectBody(solarSystemData.planets[index]);
                        }
                        break;
                    case 'ArrowUp':
                        e.preventDefault();
                        animationSpeed = Math.min(animationSpeed * 1.2, 10);
                        document.getElementById('speed-slider').value = animationSpeed;
                        updateStatus();
                        break;
                    case 'ArrowDown':
                        e.preventDefault();
                        animationSpeed = Math.max(animationSpeed / 1.2, 0.1);
                        document.getElementById('speed-slider').value = animationSpeed;
                        updateStatus();
                        break;
                }
            });
        }

        // ========== WINDOW RESIZE HANDLER ==========
        window.addEventListener('resize', () => {
            // Adjust scaling for mobile
            const solarSystem = document.getElementById('solar-system');
            if (window.innerWidth < 768) {
                solarSystem.style.transform = 'translate(-50%, -50%) scale(0.6)';
            } else if (window.innerWidth < 1200) {
                solarSystem.style.transform = 'translate(-50%, -50%) scale(0.8)';
            } else {
                solarSystem.style.transform = 'translate(-50%, -50%) scale(1)';
            }
        });

        // ========== INITIALIZE ON LOAD ==========
        window.onload = init;
    </script>
</body>
</html>
