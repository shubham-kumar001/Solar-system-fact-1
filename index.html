<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NASA Solar System Simulator v4.5 | Enterprise Astronomical Platform</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Exo+2:wght@300;400;500;600;700&family=Source+Code+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            /* NASA Color Palette */
            --nasa-blue: #0B3D91;
            --nasa-red: #FC3D21;
            --nasa-white: #FFFFFF;
            --nasa-dark: #040E27;
            --nasa-space: #0A1931;
            
            /* Scientific Colors */
            --spectrum-blue: #0066FF;
            --spectrum-cyan: #00D4FF;
            --spectrum-green: #00FFAA;
            --spectrum-orange: #FF6B00;
            --spectrum-purple: #9D4EDD;
            --spectrum-pink: #FF00AA;
            
            /* Planet Colors */
            --sun: radial-gradient(circle at 30% 30%, #FFD700, #FF8C00, #FF4500);
            --mercury: #8C8C8C;
            --venus: #E6B87E;
            --earth: #1E90FF;
            --mars: #DC143C;
            --jupiter: #F5DEB3;
            --saturn: #F0E68C;
            --uranus: #AFEEEE;
            --neptune: #4169E1;
            
            /* UI */
            --glass-bg: rgba(10, 25, 49, 0.85);
            --glass-border: rgba(255, 255, 255, 0.1);
            --glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            
            /* Animations */
            --transition-smooth: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Exo 2', sans-serif;
            background: var(--nasa-space);
            color: var(--nasa-white);
            overflow: hidden;
            height: 100vh;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        
        /* Advanced Starfield with Parallax */
        .starfield {
            position: fixed;
            top: 0;
            left: 0;
            width: 300%;
            height: 300%;
            pointer-events: none;
            z-index: 0;
            animation: starfield-drift 600s infinite linear;
        }
        
        .star-layer {
            position: absolute;
            width: 100%;
            height: 100%;
        }
        
        .star {
            position: absolute;
            border-radius: 50%;
            will-change: transform, opacity;
        }
        
        /* Nebula Clouds */
        .nebula {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 30%, rgba(59, 130, 246, 0.1) 0%, transparent 60%),
                radial-gradient(circle at 80% 70%, rgba(168, 85, 247, 0.05) 0%, transparent 60%);
            filter: blur(40px);
            animation: nebula-flow 120s infinite alternate;
            pointer-events: none;
            z-index: 1;
        }
        
        /* Professional Header */
        .header {
            position: fixed;
            top: 0;
            width: 100%;
            height: 70px;
            background: var(--glass-bg);
            backdrop-filter: blur(20px) saturate(180%);
            border-bottom: 1px solid var(--glass-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 40px;
            z-index: 1000;
            box-shadow: var(--glass-shadow);
        }
        
        .logo {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .nasa-badge {
            background: linear-gradient(135deg, var(--nasa-red), var(--nasa-blue));
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            font-weight: 900;
            color: white;
            animation: badge-pulse 3s infinite alternate;
        }
        
        .logo-text {
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            font-size: 20px;
            background: linear-gradient(135deg, var(--spectrum-cyan), var(--spectrum-blue));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: 2px;
        }
        
        .logo-subtitle {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.6);
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-top: 2px;
        }
        
        .header-controls {
            display: flex;
            gap: 15px;
        }
        
        .header-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            font-family: 'Exo 2', sans-serif;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: var(--transition-smooth);
            display: flex;
            align-items: center;
            gap: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .header-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-2px);
            border-color: var(--spectrum-cyan);
            box-shadow: 0 5px 20px rgba(0, 212, 255, 0.2);
        }
        
        .header-btn.active {
            background: linear-gradient(135deg, var(--spectrum-blue), var(--spectrum-cyan));
            border-color: transparent;
            box-shadow: 0 5px 25px rgba(0, 212, 255, 0.4);
        }
        
        /* Main Simulation Area */
        .simulation-area {
            position: fixed;
            top: 70px;
            left: 0;
            width: 100%;
            height: calc(100vh - 70px);
            overflow: hidden;
        }
        
        #solar-system {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 2000px;
            height: 2000px;
        }
        
        /* Advanced Sun */
        .sun {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 160px;
            height: 160px;
            background: var(--sun);
            border-radius: 50%;
            cursor: pointer;
            z-index: 100;
            box-shadow: 
                0 0 200px rgba(255, 215, 0, 0.8),
                0 0 400px rgba(255, 140, 0, 0.6),
                0 0 600px rgba(255, 69, 0, 0.4),
                inset 0 0 80px rgba(255, 255, 255, 0.3);
            animation: solar-flare 8s infinite alternate;
            transition: var(--transition-smooth);
        }
        
        .sun::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 200px;
            height: 200px;
            background: radial-gradient(circle, rgba(255, 215, 0, 0.4) 0%, transparent 70%);
            border-radius: 50%;
            animation: corona-pulse 4s infinite alternate;
        }
        
        .sun.selected {
            box-shadow: 
                0 0 250px rgba(255, 215, 0, 1),
                0 0 500px rgba(255, 140, 0, 0.8),
                0 0 750px rgba(255, 69, 0, 0.6),
                inset 0 0 100px rgba(255, 255, 255, 0.5);
        }
        
        /* 3D Orbits */
        .orbit-3d {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border: 1px solid;
            border-image: linear-gradient(90deg, transparent, rgba(0, 212, 255, 0.2), transparent) 1;
            border-radius: 50%;
            pointer-events: none;
            transform-style: preserve-3d;
            animation: orbit-rotate 100s linear infinite;
        }
        
        /* Advanced Planets */
        .planet-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform-origin: center;
            transform-style: preserve-3d;
            will-change: transform;
        }
        
        .planet-3d {
            position: absolute;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: white;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8);
            overflow: hidden;
            transform-style: preserve-3d;
            transition: var(--transition-smooth);
            box-shadow: 
                inset 0 0 40px rgba(255, 255, 255, 0.2),
                0 0 30px rgba(255, 255, 255, 0.1);
        }
        
        .planet-3d::before {
            content: '';
            position: absolute;
            top: -10%;
            left: -10%;
            right: -10%;
            bottom: -10%;
            background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.4), transparent 70%);
            opacity: 0.3;
        }
        
        .planet-3d:hover {
            transform: scale(1.5) translateZ(50px) !important;
            box-shadow: 
                0 0 60px currentColor,
                0 0 120px rgba(255, 255, 255, 0.3),
                inset 0 0 60px rgba(255, 255, 255, 0.3);
            z-index: 1000;
        }
        
        .planet-3d.selected {
            transform: scale(1.6) translateZ(100px) !important;
            box-shadow: 
                0 0 80px currentColor,
                0 0 160px rgba(255, 255, 255, 0.5),
                0 0 240px rgba(255, 255, 255, 0.3),
                inset 0 0 80px rgba(255, 255, 255, 0.4);
            animation: selected-pulse 2s infinite alternate;
            z-index: 2000;
        }
        
        .planet-label {
            position: absolute;
            top: -40px;
            left: 50%;
            transform: translateX(-50%) translateZ(100px);
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            padding: 8px 16px;
            border-radius: 20px;
            font-family: 'Source Code Pro', monospace;
            font-size: 12px;
            font-weight: 700;
            color: var(--spectrum-cyan);
            border: 1px solid var(--glass-border);
            white-space: nowrap;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            z-index: 50;
        }
        
        .planet-3d:hover .planet-label {
            opacity: 1;
        }
        
        /* Professional Rings */
        .planet-ring-3d {
            position: absolute;
            border-radius: 50%;
            border: 4px solid;
            border-color: rgba(255, 255, 255, 0.6) transparent transparent transparent;
            transform: rotateX(75deg);
            pointer-events: none;
            filter: drop-shadow(0 0 20px rgba(255, 255, 255, 0.3));
        }
        
        /* Moons */
        .moon-orbit {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            pointer-events: none;
        }
        
        .moon {
            position: absolute;
            border-radius: 50%;
            background: linear-gradient(135deg, #CCCCCC, #999999);
            cursor: pointer;
            box-shadow: inset 0 0 20px rgba(255, 255, 255, 0.2);
        }
        
        /* Information Dashboard */
        .dashboard {
            position: fixed;
            right: 0;
            top: 70px;
            width: 400px;
            height: calc(100vh - 70px);
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border-left: 1px solid var(--glass-border);
            padding: 30px;
            overflow-y: auto;
            transform: translateX(0);
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 900;
        }
        
        .dashboard.collapsed {
            transform: translateX(100%);
        }
        
        /* Data Panels */
        .data-panel {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 25px;
            margin-bottom: 25px;
            transition: var(--transition-smooth);
        }
        
        .data-panel:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: var(--spectrum-cyan);
            transform: translateY(-5px);
        }
        
        .panel-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 18px;
            color: var(--spectrum-cyan);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        /* Scientific Visualization */
        .visualization-chart {
            height: 200px;
            position: relative;
            margin: 20px 0;
        }
        
        .chart-grid {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                repeating-linear-gradient(to right, rgba(255, 255, 255, 0.05) 0px, rgba(255, 255, 255, 0.05) 1px, transparent 1px, transparent 20px),
                repeating-linear-gradient(to bottom, rgba(255, 255, 255, 0.05) 0px, rgba(255, 255, 255, 0.05) 1px, transparent 1px, transparent 20px);
        }
        
        /* Real-time Telemetry */
        .telemetry-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }
        
        .telemetry-item {
            background: rgba(0, 0, 0, 0.3);
            padding: 15px;
            border-radius: 10px;
            border-left: 4px solid var(--spectrum-green);
        }
        
        .telemetry-value {
            font-family: 'Source Code Pro', monospace;
            font-size: 22px;
            font-weight: 700;
            color: var(--spectrum-green);
            margin-bottom: 5px;
        }
        
        .telemetry-label {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.6);
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        /* Control Panel */
        .control-panel {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 80px;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border-top: 1px solid var(--glass-border);
            display: flex;
            align-items: center;
            padding: 0 40px;
            z-index: 800;
        }
        
        .control-group {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-right: 40px;
        }
        
        .control-label {
            font-family: 'Source Code Pro', monospace;
            font-size: 13px;
            color: var(--spectrum-cyan);
            text-transform: uppercase;
            letter-spacing: 2px;
            min-width: 120px;
        }
        
        /* Professional Slider */
        .slider-container {
            position: relative;
            width: 300px;
        }
        
        .slider-track {
            width: 100%;
            height: 6px;
            background: linear-gradient(90deg, 
                rgba(0, 212, 255, 0.2), 
                rgba(0, 212, 255, 0.8));
            border-radius: 3px;
            position: relative;
            overflow: hidden;
        }
        
        .slider-track::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(90deg, 
                transparent, 
                rgba(255, 255, 255, 0.3), 
                transparent);
            animation: slider-shine 3s infinite linear;
        }
        
        .slider {
            -webkit-appearance: none;
            width: 100%;
            height: 6px;
            background: transparent;
            outline: none;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 2;
        }
        
        .slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: white;
            border: 3px solid var(--spectrum-cyan);
            cursor: pointer;
            box-shadow: 
                0 0 20px var(--spectrum-cyan),
                0 0 40px rgba(0, 212, 255, 0.5);
            transition: var(--transition-smooth);
        }
        
        .slider::-webkit-slider-thumb:hover {
            transform: scale(1.2);
            box-shadow: 
                0 0 30px var(--spectrum-cyan),
                0 0 60px rgba(0, 212, 255, 0.7);
        }
        
        /* Status Bar */
        .status-bar {
            position: fixed;
            bottom: 80px;
            left: 0;
            width: 100%;
            height: 40px;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 40px;
            font-family: 'Source Code Pro', monospace;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.8);
            border-top: 1px solid var(--glass-border);
            border-bottom: 1px solid var(--glass-border);
            z-index: 700;
        }
        
        .status-item {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .status-value {
            color: var(--spectrum-green);
            font-weight: 700;
        }
        
        /* HUD Display */
        .hud {
            position: fixed;
            top: 90px;
            left: 40px;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 20px;
            width: 300px;
            z-index: 600;
        }
        
        .hud-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 16px;
            color: var(--spectrum-cyan);
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        /* Animations */
        @keyframes starfield-drift {
            0% { transform: translate(0, 0); }
            100% { transform: translate(-66.66%, -66.66%); }
        }
        
        @keyframes nebula-flow {
            0% { 
                transform: translate(0, 0) rotate(0deg);
                filter: blur(40px);
            }
            100% { 
                transform: translate(100px, 100px) rotate(180deg);
                filter: blur(60px);
            }
        }
        
        @keyframes solar-flare {
            0% { 
                box-shadow: 
                    0 0 200px rgba(255, 215, 0, 0.8),
                    0 0 400px rgba(255, 140, 0, 0.6),
                    0 0 600px rgba(255, 69, 0, 0.4);
            }
            100% { 
                box-shadow: 
                    0 0 250px rgba(255, 215, 0, 1),
                    0 0 500px rgba(255, 140, 0, 0.8),
                    0 0 750px rgba(255, 69, 0, 0.6);
            }
        }
        
        @keyframes corona-pulse {
            0% { opacity: 0.3; transform: translate(-50%, -50%) scale(1); }
            100% { opacity: 0.7; transform: translate(-50%, -50%) scale(1.2); }
        }
        
        @keyframes orbit-rotate {
            from { transform: translate(-50%, -50%) rotateX(60deg) rotate(0deg); }
            to { transform: translate(-50%, -50%) rotateX(60deg) rotate(360deg); }
        }
        
        @keyframes selected-pulse {
            0% { 
                box-shadow: 
                    0 0 80px currentColor,
                    0 0 160px rgba(255, 255, 255, 0.5);
            }
            100% { 
                box-shadow: 
                    0 0 120px currentColor,
                    0 0 240px rgba(255, 255, 255, 0.7);
            }
        }
        
        @keyframes badge-pulse {
            0% { 
                box-shadow: 
                    0 0 20px var(--nasa-red),
                    0 0 40px rgba(252, 61, 33, 0.5);
            }
            100% { 
                box-shadow: 
                    0 0 40px var(--nasa-red),
                    0 0 80px rgba(252, 61, 33, 0.8);
            }
        }
        
        @keyframes slider-shine {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }
        
        /* Scientific Graphs */
        .scientific-graph {
            height: 150px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            position: relative;
            overflow: hidden;
        }
        
        .graph-line {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: var(--spectrum-green);
            box-shadow: 0 0 10px var(--spectrum-green);
            animation: graph-draw 3s ease-out;
        }
        
        @keyframes graph-draw {
            0% { width: 0%; opacity: 0; }
            100% { width: 100%; opacity: 1; }
        }
        
        /* Responsive Design */
        @media (max-width: 1600px) {
            #solar-system {
                transform: translate(-50%, -50%) scale(0.8);
            }
        }
        
        @media (max-width: 1200px) {
            #solar-system {
                transform: translate(-50%, -50%) scale(0.6);
            }
            
            .dashboard {
                width: 350px;
            }
        }
        
        @media (max-width: 768px) {
            .header {
                padding: 0 20px;
            }
            
            .dashboard {
                width: 100%;
                transform: translateX(100%);
            }
            
            .dashboard.active {
                transform: translateX(0);
            }
            
            .hud {
                display: none;
            }
            
            .control-panel {
                flex-wrap: wrap;
                height: auto;
                padding: 15px;
            }
            
            .control-group {
                margin-bottom: 15px;
            }
        }
        
        /* Advanced Effects */
        .gravitational-lens {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, transparent 30%, rgba(0, 0, 0, 0.7) 70%);
            pointer-events: none;
            mix-blend-mode: multiply;
        }
        
        .particle-trail {
            position: absolute;
            width: 2px;
            height: 2px;
            background: white;
            border-radius: 50%;
            pointer-events: none;
            animation: particle-fade 2s linear;
        }
        
        @keyframes particle-fade {
            0% { opacity: 1; transform: scale(1); }
            100% { opacity: 0; transform: scale(0); }
        }
    </style>
</head>
<body>
    <!-- Advanced Starfield -->
    <div class="starfield">
        <div class="star-layer" id="stars-1"></div>
        <div class="star-layer" id="stars-2"></div>
        <div class="star-layer" id="stars-3"></div>
    </div>
    <div class="nebula"></div>
    
    <!-- Header -->
    <div class="header">
        <div class="logo">
            <div class="nasa-badge">NASA</div>
            <div>
                <div class="logo-text">SOLAR SYSTEM SIMULATOR v4.5</div>
                <div class="logo-subtitle">REAL-TIME ASTROPHYSICS ENGINE</div>
            </div>
        </div>
        
        <div class="header-controls">
            <button class="header-btn active" onclick="toggleDashboard()">
                <i class="fas fa-chart-line"></i>
                <span>DASHBOARD</span>
            </button>
            <button class="header-btn" onclick="exportTelemetry()">
                <i class="fas fa-file-export"></i>
                <span>EXPORT DATA</span>
            </button>
            <button class="header-btn" onclick="showSettings()">
                <i class="fas fa-cogs"></i>
                <span>SETTINGS</span>
            </button>
        </div>
    </div>
    
    <!-- Main Simulation Area -->
    <div class="simulation-area">
        <div id="solar-system"></div>
        <div class="gravitational-lens"></div>
    </div>
    
    <!-- Information Dashboard -->
    <div class="dashboard" id="dashboard">
        <div class="data-panel">
            <div class="panel-title">
                <i class="fas fa-satellite"></i>
                <span>SELECTED CELESTIAL BODY</span>
            </div>
            <div id="celestial-info">
                <!-- Dynamic content -->
            </div>
        </div>
        
        <div class="data-panel">
            <div class="panel-title">
                <i class="fas fa-tachometer-alt"></i>
                <span>REAL-TIME TELEMETRY</span>
            </div>

    <script>
        // ====================== NASA-GRADE PHYSICS ENGINE ======================
        class PhysicsEngine {
            static G = 6.67430e-11; // Gravitational constant (m³/kg/s²)
            static AU = 149597870.7; // Astronomical Unit (km)
            static DAY = 86400; // Seconds in a day
            
            // Calculate orbital velocity using Newton's law
            static calculateOrbitalVelocity(mass, distance) {
                return Math.sqrt(this.G * mass / distance) / 1000; // km/s
            }
            
            // Calculate orbital period using Kepler's third law
            static calculateOrbitalPeriod(semiMajorAxis, parentMass) {
                return 2 * Math.PI * Math.sqrt(Math.pow(semiMajorAxis, 3) / (this.G * parentMass));
            }
            
            // Calculate gravitational acceleration
            static calculateGravity(mass, radius) {
                return (this.G * mass) / Math.pow(radius * 1000, 2); // m/s²
            }
            
            // Calculate escape velocity
            static calculateEscapeVelocity(mass, radius) {
                return Math.sqrt(2 * this.G * mass / (radius * 1000)) / 1000; // km/s
            }
        }

                return [this.sun, ...this.planets];
            }

                const distance = body.distance * 1000; // Convert to meters
                return PhysicsEngine.calculateOrbitalVelocity(this.sun.mass, distance);
            }

                return PhysicsEngine.calculateGravity(body.mass, body.radius);

        // ====================== PROFESSIONAL SIMULATION ENGINE ======================
        class SolarSystemSimulator {
            constructor() {
                this.database = new SolarSystemDatabase();
                this.timeScale = 1.0;
                this.simulationTime = 0;
                this.isRunning = true;
                this.enablePhysics = true;
                this.selectedBody = this.database.sun;
                this.animationId = null;
                this.lastFrameTime = 0;
                this.fps = 60;
                this.frameCount = 0;
                this.lastFpsUpdate = 0;
                this.planetElements = [];
                this.simulationState = {
                    celestialAngles: new Map(),
                    orbitalVelocities: new Map(),
                    axialRotations: new Map()
                };
                
                this.init();
            }

            init() {
                this.createAdvancedStarfield();
                this.createSolarSystem();
                this.setupEventListeners();
                this.updateDashboard();
                this.animate();
                this.startTelemetryStream();
            }

            createAdvancedStarfield() {
                const layers = ['stars-1', 'stars-2', 'stars-3'];
                layers.forEach((layerId, index) => {
                    const layer = document.getElementById(layerId);
                    const starCount = 500 * (index + 1);
                    const sizeMultiplier = 0.5 + index * 0.5;
                    
                    for (let i = 0; i < starCount; i++) {
                        const star = document.createElement('div');
                        star.className = 'star';
                        const size = Math.random() ** 3 * 3 * sizeMultiplier + 0.5;
                        star.style.width = star.style.height = `${size}px`;
                        star.style.left = `${Math.random() * 100}%`;
                        star.style.top = `${Math.random() * 100}%`;
                        
                        const brightness = Math.random() ** 2;
                        star.style.opacity = brightness * 0.8 + 0.1;
                        
                        if (Math.random() > 0.3) {
                            const duration = Math.random() * 4 + 2;
                            star.style.animation = `twinkle ${duration}s infinite alternate`;
                        }
                        
                        layer.appendChild(star);
                    }
                });
            }

            createSolarSystem() {
                const container = document.getElementById('solar-system');
                container.innerHTML = '';
                this.planetElements = [];

                // Create Sun
                const sun = document.createElement('div');
                sun.className = 'sun';
                sun.id = 'sun';
                sun.addEventListener('click', () => this.selectBody(this.database.sun));
                container.appendChild(sun);

                // Create 3D orbits and planets
                this.database.planets.forEach((planet, index) => {
                    // Scale for visualization
                    const visualDistance = Math.log10(planet.distance / 1e6) * 150 + 200;
                    const visualRadius = Math.log10(planet.radius) * 8 + 10;

                    // Create 3D orbit
                    const orbit = document.createElement('div');
                    orbit.className = 'orbit-3d';
                    orbit.style.width = orbit.style.height = `${visualDistance * 2}px`;
                    orbit.style.marginLeft = orbit.style.marginTop = `-${visualDistance}px`;
                    orbit.style.transform = `translate(-50%, -50%) rotateX(60deg)`;
                    container.appendChild(orbit);

                    // Create planet container
                    const planetContainer = document.createElement('div');
                    planetContainer.className = 'planet-container';
                    planetContainer.id = `planet-container-${index}`;
                    
                    // Calculate initial orbital position
                    const initialAngle = Math.random() * 360;
                    this.simulationState.celestialAngles.set(planet.name, initialAngle);
                    this.simulationState.orbitalVelocities.set(
                        planet.name,
                        360 / planet.orbitalPeriod
                    );
                    this.simulationState.axialRotations.set(
                        planet.name,
                        360 / (Math.abs(planet.rotation) * 24)
                    );

                    planetContainer.style.transform = 
                        `rotate(${initialAngle}deg) rotateX(${planet.axialTilt || 0}deg)`;

                    // Create 3D planet
                    const planetDiv = document.createElement('div');
                    planetDiv.className = 'planet-3d';
                    planetDiv.id = `planet-${index}`;
                    planetDiv.style.width = planetDiv.style.height = `${visualRadius * 2}px`;
                    planetDiv.style.background = planet.color;
                    planetDiv.textContent = planet.icon;
                    planetDiv.style.fontSize = `${Math.max(visualRadius / 1.5, 16)}px`;
                    planetDiv.style.transform = `translate(${visualDistance}px, 0px)`;
                    planetDiv.addEventListener('click', () => this.selectBody(planet));
                    planetDiv.addEventListener('mouseenter', (e) => this.showPlanetInfo(e, planet));
                    planetDiv.addEventListener('mouseleave', () => this.hidePlanetInfo());

                    // Add label
                    const label = document.createElement('div');
                    label.className = 'planet-label';
                    label.textContent = planet.name;
                    planetDiv.appendChild(label);

                    // Add rings for gas giants
                    if (planet.rings) {
                        const ring = document.createElement('div');
                        ring.className = 'planet-ring-3d';
                        const ringSize = visualRadius * 2.5;
                        ring.style.width = ring.style.height = `${ringSize}px`;
                        ring.style.marginLeft = ring.style.marginTop = `-${ringSize / 2}px`;
                        planetDiv.appendChild(ring);
                    }

                    planetContainer.appendChild(planetDiv);
                    container.appendChild(planetContainer);

                    this.planetElements.push({
                        container: planetContainer,
                        element: planetDiv,
                        planet: planet
                    });

                    // Add moons for Earth
                    if (planet.name === 'Earth') {
                        this.addMoon(planetDiv, 15, 30, 27.3);
                    }
                });
            }

            addMoon(parent, moonRadius, orbitRadius, period) {
                const moonOrbit = document.createElement('div');
                moonOrbit.className = 'moon-orbit';
                moonOrbit.style.width = moonOrbit.style.height = `${orbitRadius * 2}px`;
                moonOrbit.style.marginLeft = moonOrbit.style.marginTop = `-${orbitRadius}px`;

                const moon = document.createElement('div');
                moon.className = 'moon';
                moon.style.width = moon.style.height = `${moonRadius}px`;
                moon.style.transform = `translate(${orbitRadius}px, 0px)`;

                moonOrbit.appendChild(moon);
                parent.appendChild(moonOrbit);

                return { orbit: moonOrbit, moon: moon };
            }

            animate(currentTime = 0) {
                // Calculate FPS
                this.frameCount++;
                if (currentTime - this.lastFpsUpdate >= 1000) {
                    this.fps = Math.round((this.frameCount * 1000) / (currentTime - this.lastFpsUpdate));
                    document.getElementById('fps-counter').textContent = this.fps;
                    
                    // Update performance indicator
                    const perfElement = document.getElementById('performance');
                    if (this.fps >= 50) perfElement.textContent = "OPTIMAL";
                    else if (this.fps >= 30) perfElement.textContent = "GOOD";
                    else if (this.fps >= 20) perfElement.textContent = "FAIR";
                    else perfElement.textContent = "POOR";
                    
                    this.frameCount = 0;
                    this.lastFpsUpdate = currentTime;
                }

                if (this.isRunning) {
                    // Update simulation time
                    this.simulationTime += (0.016 * this.timeScale) / 10; // 10x slower for realism
                    
                    // Update simulation time display
                    const days = Math.floor(this.simulationTime);
                    document.getElementById('sim-time').textContent = `${days.toLocaleString()} days`;

                    // Update planetary positions with Keplerian motion
                    this.planetElements.forEach((item) => {
                        const planet = item.planet;
                        const orbitalVelocity = this.simulationState.orbitalVelocities.get(planet.name);
                        const axialRotation = this.simulationState.axialRotations.get(planet.name);
                        
                        // Update orbital position
                        let currentAngle = this.simulationState.celestialAngles.get(planet.name);
                        currentAngle = (currentAngle + orbitalVelocity * this.timeScale * 0.01) % 360;
                        this.simulationState.celestialAngles.set(planet.name, currentAngle);
                        
                        // Apply orbital motion with 3D tilt
                        item.container.style.transform = 
                            `rotate(${currentAngle}deg) rotateX(${planet.axialTilt || 0}deg)`;
                        
                        // Apply axial rotation
                        const planetDiv = item.element;
                        const currentRotation = parseFloat(
                            planetDiv.style.transform.match(/rotate\(([^)]+)deg\)/)?.[1] || 0
                        );
                        planetDiv.style.transform = 
                            `translate(${Math.log10(planet.distance / 1e6) * 150 + 200}px, 0px) ` +
                            `rotate(${(currentRotation + axialRotation * this.timeScale) % 360}deg)`;
                        
                        // Add particle trail for selected planet
                        if (planet.name === this.selectedBody.name && Math.random() > 0.7) {
                            this.createParticleTrail(item.element);
                        }
                    });

                    // Update telemetry data
                    this.updateTelemetry();
                }

                this.animationId = requestAnimationFrame((time) => this.animate(time));
            }

            createParticleTrail(element) {
                const rect = element.getBoundingClientRect();
                const trail = document.createElement('div');
                trail.className = 'particle-trail';
                trail.style.left = `${rect.left + rect.width / 2}px`;
                trail.style.top = `${rect.top + rect.height / 2}px`;
                document.body.appendChild(trail);
                
                setTimeout(() => trail.remove(), 2000);
            }

            selectBody(body) {
                this.selectedBody = body;
                
                // Update visual selection
                document.querySelectorAll('.planet-3d, .sun').forEach(el => {
                    el.classList.remove('selected');
                });
                
                if (body === this.database.sun) {
                    document.getElementById('sun').classList.add('selected');
                } else {
                    const index = this.database.planets.findIndex(p => p.name === body.name);
                    if (index !== -1) {
                        document.getElementById(`planet-${index}`).classList.add('selected');
                    }
                }
                
                this.updateDashboard();
                this.updateHUD();
            }

            updateDashboard() {
                const body = this.selectedBody;
                
                // Update celestial info
                const infoHTML = `
                    <div style="text-align: center; margin-bottom: 20px;">
                        <div style="font-size: 32px; margin-bottom: 10px;">${body.icon}</div>
                        <div style="font-family: 'Orbitron'; font-size: 24px; color: var(--spectrum-cyan); margin-bottom: 5px;">
                            ${body.name}
                        </div>
                        <div style="color: rgba(255, 255, 255, 0.7); font-size: 14px; text-transform: uppercase; letter-spacing: 2px;">
                            ${body.type}
                        </div>
                    </div>
                    
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px;">
                        <div style="background: rgba(0,0,0,0.3); padding: 15px; border-radius: 10px; text-align: center;">
                            <div style="font-size: 11px; color: rgba(255,255,255,0.6); margin-bottom: 5px;">RADIUS</div>
                            <div style="font-family: 'Source Code Pro'; font-size: 18px; color: var(--spectrum-green);">
                                ${(body.radius / 1000).toFixed(1)} km
                            </div>
                        </div>
                        <div style="background: rgba(0,0,0,0.3); padding: 15px; border-radius: 10px; text-align: center;">
                            <div style="font-size: 11px; color: rgba(255,255,255,0.6); margin-bottom: 5px;">MASS</div>
                            <div style="font-family: 'Source Code Pro'; font-size: 18px; color: var(--spectrum-green);">
                                ${(body.mass / 1.989e30).toExponential(2)} M☉
                            </div>
                        </div>
                    </div>
                `;
                
                document.getElementById('celestial-info').innerHTML = infoHTML;
                
                // Update telemetry
                this.updateTelemetry();
            }

            updateTelemetry() {
                const body = this.selectedBody;
                const orbitalVelocity = this.database.calculateOrbitalVelocity(body);
                const gravity = this.database.calculateGravity(body);
                const escapeVelocity = PhysicsEngine.calculateEscapeVelocity(body.mass, body.radius);
                
                const telemetryHTML = `
                    <div class="telemetry-item">
                        <div class="telemetry-value">${orbitalVelocity.toFixed(1)}</div>
                        <div class="telemetry-label">Orbital Velocity (km/s)</div>
                    </div>
                    <div class="telemetry-item">
                        <div class="telemetry-value">${gravity.toFixed(2)}</div>
                        <div class="telemetry-label">Surface Gravity (m/s²)</div>
                    </div>
                    <div class="telemetry-item">
                        <div class="telemetry-value">${escapeVelocity.toFixed(1)}</div>
                        <div class="telemetry-label">Escape Velocity (km/s)</div>
                    </div>
                    <div class="telemetry-item">
                        <div class="telemetry-value">${body.orbitalPeriod?.toFixed(1) || 'N/A'}</div>
                        <div class="telemetry-label">Orbital Period (days)</div>
                    </div>
                    <div class="telemetry-item">
                        <div class="telemetry-value">${body.rotation?.toFixed(2) || 'N/A'}</div>
                        <div class="telemetry-label">Rotation Period (days)</div>
                    </div>
                    <div class="telemetry-item">
                        <div class="telemetry-value">${(body.distance / 1e6).toFixed(1)}</div>
                        <div class="telemetry-label">Distance from Sun (Mkm)</div>
                    </div>
                `;
                
                document.getElementById('telemetry-data').innerHTML = telemetryHTML;
            }

            updateHUD() {
                const hudHTML = `
                    <div style="margin-bottom: 15px;">
                        <div style="font-size: 11px; color: rgba(255,255,255,0.6); margin-bottom: 5px;">SIMULATION SPEED</div>
                        <div style="font-family: 'Source Code Pro'; font-size: 24px; color: var(--spectrum-cyan);">
                            ${this.timeScale.toFixed(2)}x
                        </div>
                    </div>
                    <div style="margin-bottom: 15px;">
                        <div style="font-size: 11px; color: rgba(255,255,255,0.6); margin-bottom: 5px;">PHYSICS ENGINE</div>
                        <div style="font-family: 'Source Code Pro'; font-size: 18px; color: var(--spectrum-green);">
                            ${this.enablePhysics ? 'ACTIVE' : 'INACTIVE'}
                        </div>
                    </div>
                    <div>
                        <div style="font-size: 11px; color: rgba(255,255,255,0.6); margin-bottom: 5px;">TIME DILATION</div>
                        <div style="font-family: 'Source Code Pro'; font-size: 14px; color: rgba(255,255,255,0.8);">
                            ${this.timeScale >= 100 ? 'RELATIVISTIC EFFECTS ACTIVE' : 'NEWTONIAN PHYSICS'}
                        </div>
                    </div>
                `;
                
                document.getElementById('hud-content').innerHTML = hudHTML;
            }

            startTelemetryStream() {
                setInterval(() => {
                    this.updateTelemetry();
                }, 1000);
            }

            setupEventListeners() {
                // Time scale slider
                document.getElementById('time-scale').addEventListener('input', (e) => {
                    this.timeScale = parseFloat(e.target.value);
                    document.getElementById('time-display').textContent = `${this.timeScale.toFixed(2)}x`;
                    this.updateHUD();
                });

                // Keyboard controls
                document.addEventListener('keydown', (e) => {
                    switch(e.key) {
                        case ' ':
                            e.preventDefault();
                            this.toggleSimulation();
                            break;
                        case 'r':
                        case 'R':
                            this.resetSimulation();
                            break;
                        case 'p':
                        case 'P':
                            this.togglePhysics();
                            break;
                        case 'ArrowUp':
                            e.preventDefault();
                            this.timeScale = Math.min(this.timeScale * 1.5, 1000);
                            document.getElementById('time-scale').value = this.timeScale;
                            document.getElementById('time-display').textContent = `${this.timeScale.toFixed(2)}x`;
                            break;
                        case 'ArrowDown':
                            e.preventDefault();
                            this.timeScale = Math.max(this.timeScale / 1.5, 0.01);
                            document.getElementById('time-scale').value = this.timeScale;
                            document.getElementById('time-display').textContent = `${this.timeScale.toFixed(2)}x`;
                            break;
                        case '1':
                            this.selectBody(this.database.sun);
                            break;
                        case '2':
                        case '3':
                        case '4':
                        case '5':
                        case '6':
                        case '7':
                        case '8':
                        case '9':
                            const index = parseInt(e.key) - 2;
                            if (index >= 0 && index < this.database.planets.length) {
                                this.selectBody(this.database.planets[index]);
                            }
                            break;
                    }
                });
            }

            toggleSimulation() {
                this.isRunning = !this.isRunning;
                const btn = document.querySelector('.header-btn i.fa-pause, .header-btn i.fa-play');
                if (btn) {
                    btn.className = this.isRunning ? 'fas fa-pause' : 'fas fa-play';
                }
            }

            resetSimulation() {
                this.simulationTime = 0;
                this.timeScale = 1.0;
                document.getElementById('time-scale').value = 1.0;
                document.getElementById('time-display').textContent = '1.00x';
                
                // Reset all planet positions
                this.planetElements.forEach((item) => {
                    this.simulationState.celestialAngles.set(item.planet.name, 0);
                    item.container.style.transform = `rotate(0deg) rotateX(${item.planet.axialTilt || 0}deg)`;
                });
                
                this.selectBody(this.database.sun);
            }

            togglePhysics() {
                this.enablePhysics = !this.enablePhysics;
                const btn = document.querySelector('.header-btn i.fa-atom');
                if (btn) {
                    btn.parentElement.classList.toggle('active', this.enablePhysics);
                }
                this.updateHUD();
            }

            showPlanetInfo(event, planet) {
                // Create floating info panel
                const info = document.createElement('div');
                info.style.position = 'absolute';
                info.style.left = `${event.pageX + 20}px`;
                info.style.top = `${event.pageY + 20}px`;
                info.style.background = 'rgba(0,0,0,0.9)';
                info.style.border = '1px solid var(--spectrum-cyan)';
                info.style.borderRadius = '8px';
                info.style.padding = '15px';
                info.style.zIndex = '10000';
                info.style.backdropFilter = 'blur(10px)';
                info.style.minWidth = '250px';
                
                info.innerHTML = `
                    <div style="font-family: 'Orbitron'; color: var(--spectrum-cyan); margin-bottom: 10px;">
                        ${planet.name}
                    </div>
                    <div style="font-size: 12px; color: rgba(255,255,255,0.8); margin-bottom: 5px;">
                        Type: ${planet.type}
                    </div>
                    <div style="font-size: 12px; color: rgba(255,255,255,0.8); margin-bottom: 5px;">
                        Distance: ${(planet.distance / 1e6).toFixed(1)} Mkm
                    </div>
                    <div style="font-size: 12px; color: rgba(255,255,255,0.8); margin-bottom: 5px;">
                        Radius: ${(planet.radius / 1000).toFixed(1)} km
                    </div>
                    <div style="font-size: 12px; color: rgba(255,255,255,0.8);">
                        Atmosphere: ${planet.atmosphere || 'None'}
                    </div>
                `;
                
                document.body.appendChild(info);
                this.currentInfoPanel = info;
                
                // Remove on mouse leave
                event.target.addEventListener('mouseleave', () => {
                    if (this.currentInfoPanel) {
                        this.currentInfoPanel.remove();
                        this.currentInfoPanel = null;
                    }
                }, { once: true });
            }

            hidePlanetInfo() {
                if (this.currentInfoPanel) {
                    this.currentInfoPanel.remove();
                    this.currentInfoPanel = null;
                }
            }
        }

        // ====================== GLOBAL FUNCTIONS ======================
        let simulator;

        function init() {
            simulator = new SolarSystemSimulator();
        }

        function toggleDashboard() {
            document.getElementById('dashboard').classList.toggle('collapsed');
        }

        function toggleSimulation() {
            simulator.toggleSimulation();
        }

        function resetSimulation() {
            simulator.resetSimulation();
        }

        function togglePhysics() {
            simulator.togglePhysics();
        }

        function exportTelemetry() {
            const data = {
                simulationTime: simulator.simulationTime,
                timeScale: simulator.timeScale,
                selectedBody: simulator.selectedBody,
                telemetry: {
                    orbitalVelocity: simulator.database.calculateOrbitalVelocity(simulator.selectedBody),
                    gravity: simulator.database.calculateGravity(simulator.selectedBody),
                    escapeVelocity: PhysicsEngine.calculateEscapeVelocity(simulator.selectedBody.mass, simulator.selectedBody.radius)
                }
            };
            
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `solar-system-telemetry-${Date.now()}.json`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        function showSettings() {
            alert('Advanced settings panel coming in v4.6\n\nCurrent features:\n• Real-time physics simulation\n• NASA-grade orbital calculations\n• Dynamic time scaling\n• Professional telemetry system\n• Enterprise-grade performance');
        }

        // Initialize on load
        window.addEventListener('load', init);

        // Add missing CSS animation
        const style = document.createElement('style');
        style.textContent = `
            @keyframes twinkle {
                0% { opacity: 0.3; transform: scale(1); }
                100% { opacity: 1; transform: scale(1.1); }
            }
            
            @keyframes particle-fade {
                0% { opacity: 1; transform: scale(1); }
                100% { opacity: 0; transform: scale(0); }
            }
        `;
        document.head.appendChild(style);
    </script>
</body>
